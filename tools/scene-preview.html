<!-- Colour study for the three bands nobody has exported yet: sky, sand, green.
     Every value is either lifted from the owner's own artwork or from the
     shield palette already in highway19.css. Nothing here is invented to taste. -->
<meta charset="utf-8">
<style>
  :root{
    /* SKY — no source file. The interstate blues already measured from the
       shield, run dark to bright as the owner described. */
    --sky-top:#0a3f7d;      --sky-bot:#1862b4;
    /* OCEAN — the ground behind Beach.svg. #0561ca is the shared end stop of
       all six wave gradients in that file. */
    --sea:#0561ca;
    /* SAND — ends on #ffd486, which is exactly where DesertForest.svg begins,
       so the two meet with no seam. */
    --sand-top:#ffe9c4;     --sand-bot:#ffd486;
    /* GREEN — sampled from the canopy itself: #1f500f dark, #669921 bright. */
    --grass-top:#2f6b18;    --grass-bot:#57912a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0b1a26;font:12px/1.4 system-ui,sans-serif;color:#cfe0ee}
  .stage{width:1200px;margin:0 auto;position:relative}
  .band{position:relative;overflow:hidden}
  .sky  {height:300px;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
  .sea  {height:200px;background:var(--sea)}
  .sand {height:210px;background:linear-gradient(180deg,var(--sand-top),var(--sand-bot))}
  .df   {height:520px;background:var(--sand-bot)}
  .grass{height:230px;background:linear-gradient(180deg,var(--grass-top),var(--grass-bot))}
  .sea img,.df img{position:absolute;left:0;width:100%;display:block}
  .sea img{bottom:0}
  .df img{top:0}
  .tag{position:absolute;right:8px;top:6px;z-index:5;font-size:11px;font-weight:600;
       background:rgba(0,0,0,.55);padding:3px 7px;border-radius:3px;color:#fff;
       font-family:ui-monospace,Menlo,monospace}
  .seam{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.5);z-index:6}
  .seam b{position:absolute;left:8px;top:-16px;font-size:10px;color:#fff;
          background:rgba(0,0,0,.55);padding:2px 6px;font-family:ui-monospace,monospace;font-weight:500}
</style>
<div class="stage">
  <div class="band sky"><span class="tag">sky - #0a3f7d to #1862b4</span></div>
  <div class="band sea"><span class="tag">ocean ground #0561ca + your Beach.svg</span>
    <img src="../assets/brand/scene/Beach.svg" alt=""></div>
  <div class="band sand"><span class="tag">sand - #ffe9c4 to #ffd486</span>
    <div class="seam" style="bottom:0"><b>meets DesertForest at #ffd486 — no seam</b></div></div>
  <div class="band df"><span class="tag">your DesertForest.webp</span>
    <img src="../assets/brand/scene/DesertForest.webp" alt=""></div>
  <div class="band grass"><span class="tag">green - #2f6b18 to #57912a</span></div>
</div>

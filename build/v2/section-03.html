<section class="sec3">

  <!-- HIS DESERT, IN THREE LAYERS. He exported the sand, the mountains' cast
       shadow and the mountains separately, each cropped by Illustrator to its
       own content - 2037.85, 2245.68 and 1918.34 wide against an art column of
       1922.52 - so none of them shares an artboard and nothing records how they
       line up.

       THE SAND IS EXACT, because it carries its own clipPath: a rect at x 53.82
       w 1921.6, and 1921.6 IS the art column, so its x 53.82 lands on the
       section's left edge and the rest follows. The mountains are the column to
       within four units. Only the shadow is estimated, by correlating its ink
       against the mountains' (tools/align_layers.js) - two independent readings,
       the correlation and simply centring it, agreed to within one per cent.
       Its left and top are the two numbers to nudge.

       Inline rather than <img> for the usual reason: an image's raster lives in
       the browser's cache and a busy machine drops it. Every id is prefixed, or
       three layers all calling their clip "clippath" would collide. -->

    <linearGradient id="sand-linear-gradient" x1="1004.97" y1="0" x2="1004.97" y2="214.96" gradientUnits="userSpaceOnUse">
      <!-- HIS TOP-OF-DESERT FADE, MADE INTO THE ACTUAL JOIN. It used to run
           his beach cream to #fde5c1 and then fade to nothing, which left a
           step across the road: #fdf3df above it, #fedca3 below. It now runs
           the whole way to his own desert sand and stays opaque, so the two
           sands are one continuous ramp and the road is the only thing
           between them. Both ends are his; only the run between them is new. -->
      <stop offset="0" stop-color="#ffd486"/>
      <stop offset="1" stop-color="#ffd486"/>
    </linearGradient>

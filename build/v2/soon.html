     Google for. build_site.js rewrites this one href for the live tree. -->

     own name should not turn up five copies of this instead of the site. -->
<meta name="robots" content="noindex,follow">

<style>
#h19-detour{
  /* ---- TYPE ---------------------------------------------------------- */
  --font-display:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --weight-display:900;          /* artboard: BeVietnamPro-Black  */
  --weight-body:300;             /* artboard: BeVietnamPro-Light  */
  /* Base scale is the stacked, centred layout for phone and tablet. The
     desktop scale is taken straight off Layout_Reference.svg further down. */
  --size-display:clamp(2.5rem,4.2vw,4.5rem);
  --size-eyebrow:clamp(.7rem,1.1vw,.82rem);
  --size-body:clamp(1.02rem,1.45vw,1.55rem);
  --size-cta:clamp(.95rem,1.05vw,1.12rem);
  --tracking-display:-.035em;
  --tracking-eyebrow:.1em;
  --leading-display:1.02;
  --leading-body:1.5;
  --gap-eyebrow:.6em;            /* eyebrow -> headline, in eyebrow ems */
  --gap-rule:1.1em;              /* rule -> body copy                   */
  --rule-w:5.6rem;
  --rule-h:4px;
  /* ---- BADGE + BUTTON (they read as a pair) --------------------------- */
  /* The triangle is sized by HEIGHT, not width - it is the height that has to
     hold its own against the headline, and height is independent of whatever
     aspect the sign artwork happens to have. 1.55em of the headline size is
     the height the old board occupied, so the block above the headline keeps
     its weight. */
  --sign-height:1.55em;
  --sign-gap:clamp(1.4rem,3vw,2.5rem);
  --edge-radius:14px;            /* button corners: rounded, sides straight */
  --edge-weight:2px;             /* matches the badge's black outline       */
  --edge-shadow-x:3px;
  --edge-shadow-y:3px;
  /* ---- COLOUR -------------------------------------------------------- */
  --page:#ffffff;
  --ink:#111314;
  --ink-soft:#54595c;
  --ink-mute:#666;               /* reference eyebrow grey */
  --accent:#ffb12e;              /* artboard button fill */
  --accent-ink:#111314;
  --sky-top:#ffffff;
  --sky-base:#f4f5f6;
  --asphalt:#1a1a1a;             /* artboard ground */
  --patch-open:#cfd2d3;        /* dug chip - artboard chewed edge */
  --tar:#1a1a1a;               /* fill = same black as the road */
  --bed-load:#232323;
  --dust:#8f9598;
  /* ---- LAYOUT -------------------------------------------------------- */
  --copy-max:52rem;
  /* Clear space above the eyebrow. --copy-space is the knob; the vh term keeps
     a short screen from opening on an empty field. Scaled well down here,
     because a phone cannot spare 200px before anything begins. */
  --copy-space:120px;
  --copy-pad-top:min(var(--copy-space),13vh);
  /* --band-gap is the whole gap between the button and the top of the band,
     and is THE knob for that distance: a tight, deliberate strip of white,
     not an empty field. The band starts where the machines start, because the
     script crops the empty sky above them away. */
  --band-gap:76px;
  --copy-pad-bottom:var(--band-gap);
  /* Reference: road line 67.12% down, so the black under it is the rest.
     --sky-px is the machines' rendered height above the road; the script
     keeps it current. Together they pin the road line.
     --black-min is the floor. On a short screen the reference share and a
     generous --copy-space cannot both fit, and the black - flat and empty by
     design - is the one that gives, down to this and no further. */
  --black-share:32.88vh;
  --black-min:24vh;
  --sky-px:140px;
  --band-h:calc(var(--black-share) + var(--sky-px));
  /* The stage is a CROP, not a stretch: the script writes --stage-ratio from
     whatever viewBox it just set, so the box always matches the scene it is
     showing and nothing is ever squashed. This is only the first-paint value. */
  --stage-ratio:1920/1040;
  /* ---- ROAD ----------------------------------------------------------
     --road-line places the road inside the scene: everything above it
     (cranes, machines, cones) and the black below it move together, and
     nothing is rescaled. The crop follows it, so nudging it is always safe -
     to move the band relative to the button, use --band-gap above.
     The black below runs to the bottom of the screen and beyond, flat and
     empty, ready for a footer laid straight over it. */
  --road-line:370px;
  /* Hole and mound are squashed with a scaleY off their shipped paths - the
     stepped, chewed silhouette is untouched, just compressed. */
  --hole-depth:40px;             /* max depth below the road line */
  --mound-height:12px;           /* max height above the road line - scaled
                                    with the hole, so the tar still reads as
                                    an overfill standing proud of the strip */

  background:var(--page);color:var(--ink);
  font-family:var(--font-body);font-weight:var(--weight-body);
  -webkit-font-smoothing:antialiased;
  /* copy, then band, then black to the bottom of the screen whatever is left */
  display:flex;flex-direction:column;min-height:100vh;
}
#h19-detour *{box-sizing:border-box}
/* flex:1 at EVERY size, not just desktop: the copy has to absorb the leftover
   height or the band stops short of the bottom of the screen and the road line
   drifts up off its share. */
#h19-detour .copy{
  max-width:var(--copy-max);margin:0 auto;text-align:center;flex:1 0 auto;
  padding:var(--copy-pad-top) 1.25rem var(--copy-pad-bottom);
}
#h19-detour h1{
  font-family:var(--font-display);font-weight:var(--weight-display);
  font-size:var(--size-display);line-height:var(--leading-display);
  letter-spacing:var(--tracking-display);
  margin:0 0 clamp(1.1rem,2.2vw,1.8rem);color:var(--ink);
}
/* Eyebrow: small, heavy, grey, uppercase and tracked out, sitting directly
   above the headline. */
#h19-detour .eyebrow{
  font-family:var(--font-display);font-weight:var(--weight-display);
  font-size:var(--size-eyebrow);line-height:1.2;
  letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;
  color:var(--ink-mute);margin:0 0 var(--gap-eyebrow);
}
/* The rule: a short, thick black bar under the headline, left-aligned with
   it. Its own element, so it never inherits type metrics. */
#h19-detour .rule{
  width:var(--rule-w);height:var(--rule-h);background:var(--ink);
  margin:0 auto var(--gap-rule);border-radius:0;   /* centred in the stack */
}
#h19-detour .lead{
  font-size:var(--size-body);line-height:var(--leading-body);color:var(--ink-soft);
  margin:0 auto .6rem;max-width:40rem;text-wrap:balance;
}
#h19-detour .lead+.lead{margin-bottom:clamp(1.8rem,3.2vw,2.6rem)}
/* The badge sizes itself off the headline: font-size is the headline's, and
   --sign-height is in em, so the two stay in proportion at every breakpoint.
   Centred directly above it, width following the artwork's own aspect. */
#h19-detour .sign{
  display:block;height:var(--sign-height);width:auto;
  margin:0 auto var(--sign-gap);
  font-size:var(--size-display);
  filter:drop-shadow(var(--edge-shadow-x) var(--edge-shadow-y) 0 var(--ink));
}
#h19-detour .cta{
  display:inline-block;font-family:var(--font-display);font-weight:var(--weight-display);
  font-size:var(--size-cta);letter-spacing:.01em;text-decoration:none;
  color:var(--accent-ink);background:var(--accent);
  padding:1em 2.3em;
  border-radius:var(--edge-radius);
  border:var(--edge-weight) solid var(--ink);
  box-shadow:var(--edge-shadow-x) var(--edge-shadow-y) 0 var(--ink);
  transition:transform .18s ease,box-shadow .18s ease;
}
#h19-detour .cta:hover{
  transform:translate(calc(var(--edge-shadow-x) * -0.5),calc(var(--edge-shadow-y) * -0.5));
  box-shadow:calc(var(--edge-shadow-x) * 1.6) calc(var(--edge-shadow-y) * 1.6) 0 var(--ink);
}
#h19-detour .cta:active{transform:translate(var(--edge-shadow-x),var(--edge-shadow-y));box-shadow:none}
#h19-detour .cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* full-bleed stage, even inside a constrained Elementor container.
   THE ROAD LINE IS ANCHORED FROM THE BOTTOM. The reference puts it 61.42% down
   the page with the black filling the 38.58% below, so the band's height is
   that black share plus however tall the machines render - and the script
   writes --sky-px with exactly that, in px, every time it sets the viewBox.
   The copy above takes whatever is left, so the road lands on its mark instead
   of being pushed to the bottom by however tall the copy happens to be. */
#h19-detour .stage-wrap{width:100vw;margin-left:calc(50% - 50vw);line-height:0;overflow:hidden;
  background:var(--asphalt);flex:0 0 auto;height:var(--band-h)}
#h19-detour #stage{display:block;width:100%;aspect-ratio:var(--stage-ratio)}

#h19-detour .patch-hole{fill:var(--patch-open)}
#h19-detour .patch-tar{fill:var(--tar)}
#h19-detour .bed-load{fill:var(--bed-load)}
#h19-detour .dust circle{fill:var(--dust);opacity:0}
#h19-detour #road,#h19-detour #road-strip{fill:var(--asphalt)}

/* NOTE: deliberately NO transform-box:fill-box anywhere. GSAP writes
   transform-origin:0 0 when it takes over an SVG transform; under fill-box
   that zero point is the element's own bbox corner, which displaces every
   rotating part by a different amount. Pivots are set as svgOrigin instead -
   literal coordinates in each machine's own space (see PIVOT in the script). */

/* =====================================================================
   DESKTOP LAYOUT - every number below is Layout_Reference.svg divided by
   its own 1973.04 x 930 canvas, so the proportions are the reference's and
   not an estimate. vw units because the machines are drawn at 1:1 with that
   canvas: the whole composition scales together or it stops matching.
   Left-aligned, indented to 15.72% - the reference block is left of centre,
   not centred - with the sign beside the prose rather than above it.
   ===================================================================== */
@media (min-width:1025px){
  #h19-detour{
    /* Each is the reference measurement twice over: as a share of the width,
       and as the pixel size it reaches on the reference's own 1973.04 canvas.
       The design grows to its natural size and then stops, which is what keeps
       a short ultrawide screen from having its copy crowded off the top. */
    --size-display:min(2.189vw,42.23px);
    --size-eyebrow:min(.604vw,11.66px);
    --size-body:min(1.046vw,20.19px);
    --size-cta:min(1.081vw,20.85px);
    --leading-body:1.2;          /* 24.23 / 20.19 - tighter than the stack */
    --copy-indent:min(16.075vw,310.14px);  /* left edge of the SIGN */
    --sign-col:min(9.675vw,186.65px);
    --sign-gap:min(4.572vw,88.21px);   /* sign to text */
    --copy-col:min(24.361vw,470px);    /* the text column, starting at 30.26% */
    --rule-w:min(9.485vw,183px);       /* 47% of the headline, not a third */
    --rule-h:min(.197vw,3.8px);
    --gap-eyebrow:1.284em;       /*  14.97 - resolves on the eyebrow's own size */
    --gap-rule:min(1.414vw,27.28px);   /* .rule has no font-size of its own */
    /* button bottom -> top of the band. The reference's own gap is to the
       MACHINE tops (93.2); the crop keeps a 2.54 sliver of headroom above
       them, so the padding is that much less. */
    --band-gap:min(4.686vw,90.4px);
    /* CLEAR SPACE ABOVE THE EYEBROW - the knob is --copy-space.
       .copy is bottom-anchored, so this is a FLOOR: on a tall screen the
       leftover height collects here and the gap is larger than asked for; on a
       short one the vh term gives way so the band is not shoved off the fold.
       The reference's own canvas leaves 163px, and it is 1091 tall. */
    --copy-space:300px;
    --copy-pad-top:min(var(--copy-space),12vh);   /* the script refines this */
    --edge-radius:min(.366vw,7.07px);
    --edge-weight:min(.155vw,3px);
  }
  /* anchored to the BOTTOM: the gap under the button is the reference's, and
     spare height collects above the eyebrow instead of drifting the band.

     THE MARGIN LINE IS LOAD-BEARING. .copy is a flex item, and an auto margin
     on the cross axis suppresses the stretch that would make it full width -
     so the inherited margin:0 auto quietly shrank it to its own content and
     centred it, and every vw indent below was then measured from inside that
     centred box rather than from the viewport. Spanning 100vw and pulling it
     back to the true left edge also makes the whole block immune to a centred,
     max-width parent - an Elementor HTML widget, say - which would otherwise
     redefine what all these percentages mean. */
  #h19-detour .copy{
    max-width:none;text-align:left;flex:1 0 auto;
    width:100vw;margin-left:calc(50% - 50vw);margin-right:0;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding-left:var(--copy-indent);padding-right:1.25rem;
  }
  #h19-detour .row{display:flex;align-items:center;gap:var(--sign-gap)}
  #h19-detour .sign{
    flex:0 0 auto;width:var(--sign-col);height:auto;margin:0;
  }
  #h19-detour .prose{width:var(--copy-col)}
  #h19-detour h1{margin:0 0 .274em}            /* 11.58 -> rule */
  #h19-detour .rule{margin:0 0 var(--gap-rule)}  /* left, not centred */
  #h19-detour .lead{margin:0;max-width:none}
  /* the shorthand matters: the stacked rule sets a bottom margin here at the
     same specificity, and left alone it would pad the prose out and drag the
     sign's centring with it */
  #h19-detour .lead+.lead{margin:1.2em 0 0}    /* 24.23: exactly one line */
  /* padding solved back from the reference's 55.82 outer height:
     55.82 = label line box (20.85 x 1.2) + 2 x padding + 2 x 3px border */
  #h19-detour .cta{
    align-self:flex-start;padding:.595em 2.2em;
    margin-left:calc(var(--sign-col) + var(--sign-gap));  /* line up under the prose */
    margin-top:min(2.516vw,48.55px);   /* the button has its own font-size */
  }
}
/* The zoom breakpoints live in the script, because the crop is a viewBox, not
   a CSS rule. The badge now shows at every width - it used to be hidden below
   640 - so on a phone the stack reads triangle, eyebrow, headline. */
@media (max-width:640px){
  #h19-detour{--copy-max:32rem;--sign-height:1.9em}
}
@media (prefers-reduced-motion:reduce){#h19-detour .cta{transition:none}}
</style>
</head>

  <div class="stage-wrap">
    <!-- viewBox is a first-paint value only: the script replaces it with the
         crop for the live viewport, and rewrites it on every resize. -->
    <svg id="stage" viewBox="0 230 1920 1040"
         preserveAspectRatio="xMidYMax slice"
         xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
         role="img" aria-label="Roadworks: an excavator, dump truck and roller repairing a road.">
      <defs>
        <!-- The band's fade. Runs in scene units from the top of the crane
             tiles down to the road line: black hides, white shows, so the
             silhouettes are gone before their own tops and there is no edge to
             see. The old sky gradient is deliberately absent - being a grey
             ramp cropped mid-way, it painted a flat grey field with a hard
             horizontal line where the stage began. -->
        <!-- The ramp STARTS ABOVE the tallest crane, so the tips come in at
             about a third rather than at nothing: misty, but still there. They
             still leave no edge, because the crane artwork's own fill is
             already near-white at its top - the mask only has to carry the
             last of it away. -->
        <linearGradient id="bandFade" gradientUnits="userSpaceOnUse"
                        x1="0" y1="193.35" x2="0" y2="370">
          <stop offset="0" stop-color="#000"/>
          <stop offset="1" stop-color="#fff"/>
        </linearGradient>
        <mask id="bandFadeMask" maskUnits="userSpaceOnUse"
              x="-1920" y="48.35" width="5760" height="381.65">
          <rect x="-1920" y="48.35"
                width="5760" height="381.65" fill="url(#bandFade)"/>
        </mask>
        
    <linearGradient id="ex_Degradado_sin_nombre_13" data-name="Degradado sin nombre 13" x1="-11666.7" y1="70.79" x2="-11666.7" y2="39.41" gradientTransform="translate(-11583.2389) scale(-1 1)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbcbcb"/>
      <stop offset=".29" stop-color="#cecece"/>

<!-- Layout first, and inline: the crop must be right at first paint and must
     not depend on a CDN answering. Then GSAP, then the animation. -->
<script>
(function(){

  /* =====================================================================
     LOOP SPEED - THIS IS THE ONE LINE.
     Lower = slower. 1 = the authored cycle; 0.5 runs it at half pace,
     which is the weight these machines want.
     ===================================================================== */
  var SPEED = 0.5;

  /* =====================================================================
     CONFIG - WHERE THE HOLES GO, AND HOW MANY.
     Everything that services a patch derives its stop from the patch's x:
     the excavator's dig, the truck's dump, the roller's pass, and the patch
     artwork itself. Nothing here needs the timeline touched.
     ===================================================================== */
  var CONFIG = {
    RANDOM_PATCHES: true,  /* false -> use fallback below */
    patchCount: 2,          /* 2, 3 or 4 - the cycle grows to fit */
    fallback: [620,1340],        /* fixed positions when random is off */
    rollLead: 110,              /* drum starts/ends this far either side */
    edgeMargin: 40,          /* keep a working machine this far inside the stage */
    stopGap: 24,                /* clearance demanded between STOPPED machines */
    keepOut: [],          /* [[x0,x1],...] stage ranges patches must avoid.
                                     The copy block sits ABOVE the stage, so
                                     nothing overlaps today - add a range here
                                     if you ever overlay text on the scene. */
    stageW: 1920
  };

  var ROAD = 370;                 /* build-time road line */
  var HOLE_D  = 'M-77 1.12L-73.57 11.46L-67.31 55.75L-60.89 71.33L-49.78 71.33L-33.84 110L-20.89 110L-9.72 82.86L-6.53 82.86L-2.07 72.01L25.26 72.01L31.59 56.6L63.83 56.6L77 1.12Z';
  var MOUND_D = 'M-83 800L-83 0L-77 -3.73L-74.53 -16.72L-65.15 -16.72L-57.46 -57.19L-41.4 -57.19L-34.96 -91.1L-12.26 -91.1L-5.81 -125L8.68 -125L18.85 -71.54L42.14 -71.54L47.11 -45.42L59.73 -45.42L63.45 -25.81L72.82 -25.81L77 -3.73L83 0L83 800Z';

  /* ---- squash the patch shapes, and place the band --------------------- */
  /* Both paths ship at their natural size and are compressed with a scaleY
     about the road line (y=0), so the stepped chewed silhouette is preserved
     exactly - same points, same notches, same steps - just flatter. */
  var root = document.getElementById('h19-detour');
  function cssNum(name, fallback){
    var v = getComputedStyle(root).getPropertyValue(name);
    var n = parseFloat(v);
    return isNaN(n) ? fallback : n;
  }
  var HOLE_NATURAL  = 110;      /* depth of the shipped hole path  */
  var MOUND_NATURAL = 125;       /* crest of the shipped mound path */
  var SKIRT_NATURAL = 800;        /* its skirt, below the road line  */

  var HOLE_DEPTH  = cssNum('--hole-depth', 40);
  var MOUND_H     = cssNum('--mound-height', 12);
  var HOLE_SCALE  = HOLE_DEPTH / HOLE_NATURAL;
  var MOUND_SCALE = MOUND_H / MOUND_NATURAL;
  var SKIRT       = SKIRT_NATURAL * MOUND_SCALE;   /* still buries the hole */

  /* the whole band rides on --road-line; nothing inside it is rescaled */
  var roadLine = cssNum('--road-line', ROAD);
  if (roadLine !== ROAD) {
    var band = document.getElementById('band');
    if (band) band.setAttribute('transform', 'translate(0,' + (roadLine - ROAD) + ')');
  }

  /* The roll clip is the drum's whole pass, so it tracks rollLead - which the
     zoom shortens on a narrow screen. dig and fill never depend on it. */
  function clips(lead){
    return {
      /* dug in LAYERS: a downward wipe, one step deeper per bucket bite */
      dig:  { x: -90, y: -2, w: 180, h: HOLE_DEPTH + 4 },
      /* tar arrives left to right; tall enough to hold crest and skirt */
      fill: { x: -90, y: -(MOUND_H + 4), w: 180, h: MOUND_H + SKIRT + 12 },
      /* the drum takes chip and mound away together, retreating left to right */
      roll: { x: -lead, y: -(MOUND_H + 4),
              w: 2 * lead, h: MOUND_H + SKIRT + 12 }
    };
  }
  var CLIP = clips(CONFIG.rollLead);

  /* ---- HOW DEEP THE HOLE IS AFTER EACH BUCKET BITE --------------------- */
  /* The dig clip wipes DOWNWARD from its own top edge as scaleY runs 0 -> 1,
     so a given scaleY exposes the hole to
         depth = CLIP.dig.y + scaleY * CLIP.dig.h        (below the road line)
     Bites are therefore authored in PIXELS OF DEPTH and converted to scaleY
     here, so the progression survives any change to --hole-depth.

     THE FIRST BITE HAS A FLOOR. The solid road strip is painted OVER every
     patch, so a scrape shallower than the strip is hidden completely and the
     first bite reads as the excavator missing. The floor is the deeper of an
     absolute 8px minimum and the strip's own height plus a visible sliver -
     the strip height is read off the artwork rather than typed in, so bite
     one still clears it if either the strip or --hole-depth is retuned. */
  var stripEl = document.getElementById('road-strip');
  var STRIP_H = stripEl ? (parseFloat(stripEl.getAttribute('height')) || 0) : 0;
  var BITE1_MIN   = 8;             /* never shallower than this, whatever else */
  var BITE1_CLEAR = STRIP_H + 3;   /* ...and never swallowed by the strip      */
  /* One entry per bucket bite - three, matching the arm swings in dig().
     At the shipped 40px hole this is 8 / 24 / 40, and the floor lifts the
     first to whatever it takes to show under the strip. */
  var BITE_FRAC = [0.20, 0.60, 1];

  var BITE_SCALE = (function(){
    var out = [], prev = 0, last = BITE_FRAC.length - 1, i, d;
    for (i = 0; i <= last; i++) {
      d = (i === last) ? HOLE_DEPTH : HOLE_DEPTH * BITE_FRAC[i];
      if (i === 0) d = Math.max(d, BITE1_MIN, BITE1_CLEAR);
      d = Math.min(d, HOLE_DEPTH);   /* never dig past the bottom of the hole */
      if (d < prev) d = prev;        /* and never step back up                */
      prev = d;
      /* the last bite opens the clip fully, so the deepest notch is uncovered
         outright rather than landing exactly on the clip's edge */
      out.push(i === last ? 1 : Math.min(1, (d - CLIP.dig.y) / CLIP.dig.h));
    }
    return out;
  })();

  /* PLANNER - shared verbatim by the Node verifiers and the page.
     Pure ES5, no DOM, no Node APIs. Everything about WHERE a machine stops is
     derived from a patch position; everything about WHEN is derived from the
     service durations below and is independent of position. */
  var PLANNER = (function () {

    /* How long each job takes, and how long each machine takes to move on.
       Positions never appear here - move a patch and none of this changes. */
    var TIMING = {
      excStart:   3.0,  dig:  3.0, excHop:   2.4,   /* excavator: dig, then hop */
      truckStart: 7.6,  dump: 3.4, truckHop: 2.6,   /* truck follows the digger */
      rollStart: 11.6,  roll: 1.4, rollHop:  4.6,   /* roller brings up the rear */
      truckDepart: 3.2, rollDepart: 6.0,            /* when each leaves the wings */
      exitDur: 3.6, tail: 1.4
    };

    /* Anchor-to-working-point offset: bucket arc mid-point, tar pile centre,
       drum centre. Mirrored machines measure from their mirrored edge. */
    var DOCK  = { exc: 189, truck: 37.8, roll: 104.98 };
    var WIDTH = { exc: 214.45, truck: 247.65, roll: 137.51 };
    var PARK  = { exc: -260, truck: -600, roll: -900 };
    var EXIT  = { exc: 2100, truck: 2450, roll: 2800 };
    var ORDER = ['exc', 'truck', 'roll'];

    function excAt(i)   { return TIMING.excStart   + i * (TIMING.dig  + TIMING.excHop); }
    function truckAt(i) { return TIMING.truckStart + i * (TIMING.dump + TIMING.truckHop); }
    function rollAt(i)  { return TIMING.rollStart  + i * (TIMING.roll + TIMING.rollHop); }
    function cycle(n)   { return rollAt(n - 1) + TIMING.roll + TIMING.exitDur + TIMING.tail; }

    /* When each machine is stopped and working at patch i. */
    function busy(m, i) {
      if (m === 'exc')   return [excAt(i),   excAt(i)   + TIMING.dig];
      if (m === 'truck') return [truckAt(i), truckAt(i) + TIMING.dump];
      return [rollAt(i), rollAt(i) + TIMING.roll];
    }

    /* How far a working machine reaches either side of the patch it services.
       The roller's span covers its whole pass, because it is working the entire
       way across. */
    function extent(m, lead) {
      if (m === 'roll') return [-lead - DOCK.roll, -lead - DOCK.roll + WIDTH.roll + 2 * lead];
      return [-DOCK[m], -DOCK[m] + WIDTH[m]];
    }

    /* ---- keyframes: [time, anchor x] per machine --------------------------- */
    /* park/exit default to the shipped wings. The page overrides them with wings
       measured off what the viewport is ACTUALLY showing, so however hard the
       scene is cropped a machine is still off-screen before it parks. The
       offsets are carried over unchanged, so every approach speed is too. */
    function buildKeys(xs, lead, park, exit) {
      park = park || PARK; exit = exit || EXIT;
      var n = xs.length, k = { exc: [], truck: [], roll: [] }, i;
      k.exc.push([0, park.exc]);
      for (i = 0; i < n; i++) {
        k.exc.push([excAt(i), xs[i] - DOCK.exc]);
        k.exc.push([excAt(i) + TIMING.dig, xs[i] - DOCK.exc]);
      }
      k.exc.push([excAt(n - 1) + TIMING.dig + TIMING.exitDur, exit.exc]);

      k.truck.push([0, park.truck], [TIMING.truckDepart, park.truck]);
      for (i = 0; i < n; i++) {
        k.truck.push([truckAt(i), xs[i] - DOCK.truck]);
        k.truck.push([truckAt(i) + TIMING.dump, xs[i] - DOCK.truck]);
      }
      k.truck.push([truckAt(n - 1) + TIMING.dump + TIMING.exitDur, exit.truck]);

      k.roll.push([0, park.roll], [TIMING.rollDepart, park.roll]);
      for (i = 0; i < n; i++) {
        k.roll.push([rollAt(i), xs[i] - lead - DOCK.roll]);
        k.roll.push([rollAt(i) + TIMING.roll, xs[i] + lead - DOCK.roll]);
      }
      k.roll.push([rollAt(n - 1) + TIMING.roll + TIMING.exitDur, exit.roll]);

      var C = cycle(n);
      for (var m = 0; m < ORDER.length; m++) {
        var arr = k[ORDER[m]];
        arr.push([C, arr[arr.length - 1][1]]);       /* hold off-stage to the wrap */
      }
      return k;
    }

    /* ---- patch state timelines -------------------------------------------- */
    function buildPatches(xs) {
      var out = [];
      for (var i = 0; i < xs.length; i++) {
        var s = excAt(i);
        out.push({
          id: i + 1, i: i, x: xs[i], start: s,
          reveal: [0, TIMING.dig],
          fill:   [truckAt(i) - s, truckAt(i) + TIMING.dump - s],
          wipe:   [rollAt(i) - s,  rollAt(i)  + TIMING.roll - s]
        });
      }
      return out;
    }

    /* ---- where a patch is allowed to be ----------------------------------- */
    /* A machine must be fully on stage while it is working, with a margin. */
    function bounds(stageW, margin, lead) {
      var lo = -Infinity, hi = Infinity;
      for (var i = 0; i < ORDER.length; i++) {
        var e = extent(ORDER[i], lead);
        lo = Math.max(lo, margin - e[0]);
        hi = Math.min(hi, stageW - margin - e[1]);
      }
      return [lo, hi];
    }

    /* Two patches must be far enough apart that no working machine at one can
       overlap a working machine at the other. */
    function minSeparation(lead) {
      var right = -Infinity, left = -Infinity;
      for (var i = 0; i < ORDER.length; i++) {
        var e = extent(ORDER[i], lead);
        right = Math.max(right, e[1]);
        left  = Math.max(left, -e[0]);
      }
      return right + left;
    }

    /* Hard check: no two machines are ever STOPPED in overlapping space at
       overlapping times. Machines passing each other in transit is fine. */
    function stoppedClear(xs, lead, crewOffset, gap) {
      var C = cycle(xs.length), stops = [], i, m, c;
      for (c = 0; c < 2; c++) {
        for (i = 0; i < xs.length; i++) {
          for (m = 0; m < ORDER.length; m++) {
            var b = busy(ORDER[m], i), e = extent(ORDER[m], lead);
            stops.push({ t0: b[0] + c * crewOffset, t1: b[1] + c * crewOffset,
                         x0: xs[i] + e[0], x1: xs[i] + e[1],
                         who: 'crew' + c + ':' + ORDER[m] + '@p' + i });
          }
        }
      }
      for (i = 0; i < stops.length; i++) {
        for (var j = i + 1; j < stops.length; j++) {
          var a = stops[i], b2 = stops[j];
          /* compare on the cycle's clock, including the wrap */
          var overlapT = false;
          for (var k = -1; k <= 1; k++) {
            var s = b2.t0 + k * C, e2 = b2.t1 + k * C;
            if (a.t0 < e2 && s < a.t1) overlapT = true;
          }
          if (!overlapT) continue;
          if (a.x0 - gap < b2.x1 && b2.x0 - gap < a.x1)
            return { ok: false, why: a.who + ' and ' + b2.who + ' stop in the same place' };
        }
      }
      return { ok: true };
    }

    /* ---- pick positions ---------------------------------------------------- */
    /* Centre-to-centre spacing two patches must keep: enough that no working
       machine at one can reach a working machine at the other, plus the demanded
       clearance between stopped machines. */
    function separation(cfg) {
      return Math.max(minSeparation(cfg.rollLead) + (cfg.stopGap || 0), cfg.minGap || 0);
    }

    /* How many patches actually FIT in this working zone. A narrow viewport gets
       a smaller zone, and a smaller zone gets fewer patches - never the asked-for
       count shoved outside the zone and off the side of the screen. */
    function capacity(cfg) {
      var b = bounds(cfg.stageW, cfg.edgeMargin, cfg.rollLead);
      var span = b[1] - b[0];
      if (span < 0) return 0;
      return Math.max(1, Math.min(cfg.patchCount, Math.floor(span / separation(cfg)) + 1));
    }

    /* Deterministic placement: n patches spread evenly down the middle of the
       zone. Used when random draw is off, and as the fallback when it fails -
       so a fallback always lands inside the zone, whatever the zone is. */
    function spread(cfg, n) {
      var b = bounds(cfg.stageW, cfg.edgeMargin, cfg.rollLead), sep = separation(cfg), out = [], i;
      if (n <= 1) return [Math.round((b[0] + b[1]) / 2)];
      var slack = Math.max(0, (b[1] - b[0]) - (n - 1) * sep);
      for (i = 0; i < n; i++) out.push(Math.round(b[0] + slack / 2 + i * sep));
      return out;
    }

    /* Uniform over the feasible set: sample the slack, then space the patches
       out by minSep. Rejection-tested, falling back to an even spread. */
    function pick(cfg, rnd) {
      rnd = rnd || Math.random;
      var n = capacity(cfg), lead = cfg.rollLead;
      var b = bounds(cfg.stageW, cfg.edgeMargin, lead);
      var sep = separation(cfg);
      var slack = (b[1] - b[0]) - (n - 1) * sep;
      if (slack < 0) return { xs: spread(cfg, n), why: 'no room for ' + n + ' patches' };

      for (var attempt = 0; attempt < 200; attempt++) {
        var u = [], i;
        for (i = 0; i < n; i++) u.push(rnd() * slack);
        u.sort(function (p, q) { return p - q; });
        var xs = [];
        for (i = 0; i < n; i++) xs.push(Math.round(b[0] + u[i] + i * sep));
        if (cfg.keepOut && cfg.keepOut.length) {
          var clash = false;
          for (i = 0; i < xs.length; i++)
            for (var z = 0; z < cfg.keepOut.length; z++)
              if (xs[i] > cfg.keepOut[z][0] && xs[i] < cfg.keepOut[z][1]) clash = true;
          if (clash) continue;
        }
        if (stoppedClear(xs, lead, cycle(n) / 2, cfg.stopGap || 0).ok) return { xs: xs };
      }
      return { xs: spread(cfg, n), why: 'no valid draw in 200 attempts' };
    }

    return { TIMING: TIMING, DOCK: DOCK, WIDTH: WIDTH, PARK: PARK, EXIT: EXIT, ORDER: ORDER,
             excAt: excAt, truckAt: truckAt, rollAt: rollAt, cycle: cycle, busy: busy,
             extent: extent, buildKeys: buildKeys, buildPatches: buildPatches,
             bounds: bounds, minSeparation: minSeparation, stoppedClear: stoppedClear,
             separation: separation, capacity: capacity, spread: spread, pick: pick };
  })();


  var T = PLANNER.TIMING;

  /* =====================================================================
     THE VIEW - WHAT THE STAGE ACTUALLY SHOWS.
     The scene is authored at 1920x620, but the page never shows all
     of it. It shows a CROP: a band around the road line, narrowed further on
     a small screen so the machines come up to a readable size. Cropping, not
     stretching - the aspect ratio of the box is written from the viewBox, so
     nothing is ever squashed.

     Each band is written as the share of the SCREEN the three machines should
     span, which is the benchmark itself rather than a number derived from it:
     halve it on a phone and each machine lands at 15-17% of screen width.
     ===================================================================== */
  var MACH_SPAN = 599.61;     /* excavator + truck + roller */
  var ZOOM = [
    {maxW: 640,      share: 0.50, lead: 60},   /* phones: heavy zoom          */
    {maxW: 1024,     share: 0.39, lead: 85},   /* tablets: intermediate       */
    {maxW: Infinity, share: 0.3108, lead: 110}  /* desktop: the reference's 30.39% */
  ];
  /* Machines work the middle 80% only; the outer strip either side is
     entry and exit runway, never a dig, a dump or a roll. */
  var WORK        = 0.80;
  var SKY_ABOVE   = 140;    /* scene shown above the road line */
  var BLACK_BELOW = 900;  /* asphalt inside the SVG; the wrap carries on */

  var stage = document.getElementById('stage');

  /* Derived from the RENDERED viewport, not the authored viewBox. */
  function view(){
    var w = window.innerWidth || document.documentElement.clientWidth || 1920;
    var z = ZOOM[ZOOM.length - 1], i;
    for(i = 0; i < ZOOM.length; i++) if(w < ZOOM[i].maxW){ z = ZOOM[i]; break; }
    var vw = Math.round(MACH_SPAN / z.share);
    /* Never show less scene than the viewport is wide in CSS pixels: past the
       reference width the machines hold their natural 1:1 size and the extra
       width simply shows more road. Without this the band keeps growing on an
       ultrawide screen until it crowds the copy off the top. */
    if (vw < w) vw = Math.round(w);
    var vx = Math.round(1920 / 2 - vw / 2);
    /* The crop TRACKS the road line rather than the build-time constant, so
       nudging --road-line slides the band and its window together and can
       never crop the tops off the machines. */
    return {
      x: vx, y: roadLine - SKY_ABOVE, w: vw, h: SKY_ABOVE + BLACK_BELOW, lead: z.lead,
      /* the working zone: the centre WORK of what is on screen */
      zoneX: Math.round(vx + vw * (1 - WORK) / 2),
      zoneW: Math.round(vw * WORK)
    };
  }

  function applyView(v){
    stage.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
    root.style.setProperty('--stage-ratio', v.w + '/' + v.h);
    /* How tall the scene above the road renders, in real pixels. The CSS adds
       it to the black share to pin the road line at the reference's 67.12%,
       so the crop and the page layout can never drift apart. */
    var px = (window.innerWidth || 1920) * SKY_ABOVE / v.w;
    root.style.setProperty('--sky-px', px.toFixed(1) + 'px');
    fitCopy();
  }

  /* ---- CLEAR SPACE ABOVE THE EYEBROW ----------------------------------
     --copy-space says how much white the copy should open with. Whether the
     screen can afford it is a LAYOUT question, not one CSS can answer: the
     band is a share of the viewport height, the copy's own height follows the
     viewport WIDTH, and the two only balance at the reference's proportions.
     So measure it. The page asks the rendered box how much room is actually
     free and takes the smaller of that and what was asked for - the gap opens
     to the full amount on a tall screen and gives way on a short one, instead
     of pushing the road line off its mark. The CSS value stands in until this
     runs, and if the layout is the stacked one this backs off entirely. */
  function px(v, of){                   /* resolve a vh/px custom property */
    var n = parseFloat(v);
    return /vh/.test(v) ? n * of / 100 : (n || 0);
  }

  function fitCopy(){
    var copy = document.querySelector('.copy'),
        row  = document.querySelector('.row'),
        cta  = document.querySelector('.cta');
    if(!copy || !row || !cta) return;
    var cs = getComputedStyle(copy), rs = getComputedStyle(root);
    if(cs.display !== 'flex'){          /* stacked layout: leave CSS alone */
      root.style.removeProperty('--copy-pad-top');
      root.style.removeProperty('--band-h');
      return;
    }
    root.style.setProperty('--copy-pad-top', '0px');

    var vh   = window.innerHeight || 0;
    var sky  = parseFloat(rs.getPropertyValue('--sky-px')) || 0;
    var want = parseFloat(cs.getPropertyValue('--copy-space')) || 0;
    var gap  = parseFloat(cs.paddingBottom) || 0;
    var content = row.getBoundingClientRect().height
                + cta.getBoundingClientRect().height
                + (parseFloat(getComputedStyle(cta).marginTop) || 0);

    /* The band at the reference's share, and the least it may shrink to. */
    var full = px(rs.getPropertyValue('--black-share'), vh) + sky;
    var least = px(rs.getPropertyValue('--black-min'), vh) + sky;

    /* Give the copy the white it asked for, then let the band take what is
       left - never more than the reference, never less than the floor. On a
       tall screen this settles on the reference exactly; on a short one the
       black gives ground so the copy is not crushed and nothing scrolls. */
    var band = Math.max(least, Math.min(full, vh - want - content - gap));
    var top  = Math.max(0, Math.min(want, vh - band - content - gap));

    root.style.setProperty('--band-h', band.toFixed(1) + 'px');
    root.style.setProperty('--copy-pad-top', top.toFixed(1) + 'px');
  }

  /* ---- build the patch artwork for wherever they landed ----------------- */
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var n = document.createElementNS(NS, tag);
    for(var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function paintPatches(XS, C){
    var defs = document.querySelector('#stage defs');
    var host = document.getElementById('patches');
    for(var i=0;i<XS.length;i++){
      var id = 'patch-' + (i+1);
      ['dig','fill','roll'].forEach(function(kind){
        var g = C[kind];
        var cp = el('clipPath', {id: id + '-clip-' + kind});
        cp.appendChild(el('rect', {id: id + '-' + kind, x: g.x, y: g.y, width: g.w, height: g.h}));
        defs.appendChild(cp);
      });
      /* the roll clip wraps BOTH shapes, so the drum takes the chip and the
         mound away together and leaves nothing behind */
      var grp  = el('g', {id: id, transform: 'translate(' + XS[i] + ',' + ROAD + ')'});
      var roll = el('g', {'clip-path': 'url(#' + id + '-clip-roll)'});
      var dg   = el('g', {'clip-path': 'url(#' + id + '-clip-dig)'});
      dg.appendChild(el('path', {'class': 'patch-hole', d: HOLE_D,
        transform: 'scale(1,' + HOLE_SCALE + ')'}));
      var fg   = el('g', {'clip-path': 'url(#' + id + '-clip-fill)'});
      fg.appendChild(el('path', {'class': 'patch-tar', d: MOUND_D,
        transform: 'scale(1,' + MOUND_SCALE + ')'}));
      roll.appendChild(dg); roll.appendChild(fg); grp.appendChild(roll);
      host.appendChild(grp);
    }
  }

  /* Strip a layout back out again, so the next one starts from bare markup. */
  function clearPatches(){
    var host = document.getElementById('patches');
    while(host.firstChild) host.removeChild(host.firstChild);
    var defs = document.querySelector('#stage defs');
    var gone = defs.querySelectorAll('clipPath[id^="patch-"]');
    for(var i=0;i<gone.length;i++) defs.removeChild(gone[i]);
  }

  /* ---- CROP THE STAGE NOW, before anything is fetched ------------------ */
  var VIEW = view();
  applyView(VIEW);

  /* Everything the animation half needs, so it never has to recompute the
     view or duplicate the geometry. */
  window.H19 = {
    CONFIG: CONFIG, PLANNER: PLANNER, T: T, clips: clips, BITE_SCALE: BITE_SCALE,
    paintPatches: paintPatches, clearPatches: clearPatches,
    view: view, applyView: applyView, fitCopy: fitCopy,
    VIEW: VIEW, onLayout: []
  };

  /* One resize listener for the page. It re-crops immediately - that costs
     nothing and must happen with or without the animation - then tells any
     subscriber whether the crop actually changed, because only then do the
     patch positions and timelines have to be rebuilt. */
  var settle = null;
  window.addEventListener('resize', function(){
    if(settle) clearTimeout(settle);
    settle = setTimeout(function(){
      settle = null;
      var v = view(), changed = !window.H19.VIEW || v.w !== window.H19.VIEW.w;
      window.H19.VIEW = v;
      applyView(v);
      var subs = window.H19.onLayout;
      for(var i=0;i<subs.length;i++) subs[i](v, changed);
    }, 180);
  });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  if(!window.gsap || !window.H19){return;}
  var H = window.H19;
  var CONFIG = H.CONFIG, PLANNER = H.PLANNER, T = H.T, clips = H.clips,
      BITE_SCALE = H.BITE_SCALE, paintPatches = H.paintPatches,
      clearPatches = H.clearPatches;

  gsap.globalTimeline.timeScale(0.5);

  /* Wheel radii in the vehicles' own units - converts travel into rotation so
     the wheels never look like they are skating. Scale is 1:1. */
  var R = {exc:12.45, truck:11.93, rollDrum:22.44, rollWheel:17.55};

  /* Joint pivots, measured off the Illustrator artwork, in each machine's own
     local coordinate space. Given to GSAP as svgOrigin, so they are used
     verbatim - no bbox maths, nothing for a browser to reinterpret. */
  var PIVOT = {
    boom:   '91.9 61.1',      /* Crane_A on the cab (fitted to the foot cap)  */
    stick:  '169.99 17.19',   /* Crane_B on the boom tip (literal pin)        */
    bucket: '185.07 59.66',   /* Spoon on the stick tip (literal pin)         */
    bed:      '174.65 109.8', /* Trunck rear-bottom corner                    */
    tailgate: '193.5 65',     /* bed rear-top corner: the tailgate hangs here */
    load:   '186.18 64.91',   /* heap slides toward the tailgate              */
    excF:'95.88 96.25',  excR:'34.49 96.25',
    tkF:'32.73 125.13',  tkM:'118.21 125.13', tkR:'149.22 125.13',
    rlWheel:'104.27 59.69', rlDrum:'32.53 55.33'
  };
  var BED_REST = -23.06;      /* the artwork ships tipped; this lays it flat  */
  var TAILGATE_SHUT = 27.32;  /* swings the open tailgate flat to the bed end */

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function org(sel, o, extra){
    var e = document.querySelector(sel); if(!e) return;
    var props = {svgOrigin:o};
    for(var key in extra) props[key] = extra[key];
    gsap.set(e, props);
  }

  ['a','b'].forEach(function(c){
    org('#excavator-'+c+'-boom',   PIVOT.boom);
    org('#excavator-'+c+'-stick',  PIVOT.stick);
    org('#excavator-'+c+'-bucket', PIVOT.bucket);
    org('#excavator-'+c+'-wheel-front', PIVOT.excF);
    org('#excavator-'+c+'-wheel-rear',  PIVOT.excR);
    /* the source ships the bed tipped and the spill showing: lay it flat.
       The tailgate lives inside Trunck so it tips with the bed; it is held
       shut on its own hinge until the bed actually rises. */
    org('#truck-'+c+'-bed', PIVOT.bed, {rotation:BED_REST});
    org('#truck-'+c+'-tailgate', PIVOT.tailgate, {rotation:TAILGATE_SHUT});
    org('#truck-'+c+'-load', PIVOT.load);
    org('#truck-'+c+'-wheel-front', PIVOT.tkF);
    org('#truck-'+c+'-wheel-mid',   PIVOT.tkM);
    org('#truck-'+c+'-wheel-rear',  PIVOT.tkR);
    org('#roller-'+c+'-wheel', PIVOT.rlWheel);
    org('#roller-'+c+'-drum',  PIVOT.rlDrum);
    /* the pour is wiped downward from its own top edge, so it falls */
    gsap.set('#truck-'+c+'-spill', {svgOrigin:'102.92 22.44', opacity:0, scaleY:0});
    gsap.set('#excavator-'+c+'-dust circle', {svgOrigin:'0 0'});
    gsap.set('#truck-'+c+'-dust circle',     {svgOrigin:'0 0'});
    gsap.set('#roller-'+c+'-dust circle',    {svgOrigin:'0 0'});
  });
  function patchOrigins(PATCHES, C){
    PATCHES.forEach(function(p){
      gsap.set('#patch-'+p.id+'-dig',  {svgOrigin: '0 ' + C.dig.y});   /* top edge: wipes down */
      gsap.set('#patch-'+p.id+'-fill', {svgOrigin: C.fill.x + ' 0'});
      gsap.set('#patch-'+p.id+'-roll', {svgOrigin: (C.roll.x + C.roll.w) + ' 0'});
    });
  }
  for(var ci=1; ci<=18; ci++) gsap.set('#cone-'+ci, {svgOrigin:'7.49 19.16'});

  /* ---------- dust ------------------------------------------------------ */
  function puff(sel){
    return gsap.fromTo(sel+' circle',
      {scale:.22, opacity:.4, x:0, y:0},
      {scale:2.1, opacity:0, duration:.95, ease:'power2.out', stagger:.07,
       x:function(i){return -10 - i*7;}, y:function(i){return -7 - i*5;}});
  }

  /* ---------- STEP: the excavator takes three bites --------------------- */
  var K = T.dig / 3;              /* one bite, so the pose scales with T.dig */
  function dig(tl, c, at){
    var BM='#excavator-'+c+'-boom', ST='#excavator-'+c+'-stick', BK='#excavator-'+c+'-bucket';
    for(var i=0;i<3;i++){
      var t = at + i*0.90*K;
      /* reach out and down */
      tl.to(BM,{rotation:12, duration:.28*K, ease:'power1.inOut'}, t)
        .to(ST,{rotation:-14,duration:.28*K, ease:'power1.inOut'}, t)
        .to(BK,{rotation:-20,duration:.28*K, ease:'power1.inOut'}, t)
      /* bite - bucket curls into the road */
        .to(BM,{rotation:17, duration:.20*K, ease:'power2.in'}, t+.28*K)
        .to(BK,{rotation:34, duration:.20*K, ease:'power2.in'}, t+.28*K)
      /* lift clear */
        .to(BM,{rotation:-8, duration:.22*K, ease:'power1.out'}, t+.48*K)
        .to(ST,{rotation:6,  duration:.22*K, ease:'power1.out'}, t+.48*K)
        .to(BK,{rotation:46, duration:.22*K, ease:'power1.out'}, t+.48*K)
      /* swing back right and dump to the side */
        .to(BM,{rotation:-13,duration:.18*K, ease:'power1.in'}, t+.70*K)
        .to(BK,{rotation:-30,duration:.18*K, ease:'power1.in'}, t+.70*K)
        .add(puff('#excavator-'+c+'-dust'), t+.34*K);
    }
    /* settle back into the travel pose */
    tl.to([BM,ST,BK],{rotation:0, duration:.30*K, ease:'power1.inOut'}, at+2.70*K);
  }

  /* ---------- THE TAR IN THE BED ---------------------------------------
     The heap is drawn in the bed's own rim frame and clipped to the cargo
     well (see bedClip in build.js), so it can never paint outside the bed
     walls at any bed angle. Level is a SLIDE along the rim normal: sink the
     heap into the bed and the clip crops whatever drops under the rail, so
     the tar line falls the way a real load empties. No scaling - scaling a
     heap whose points sit at different heights shears it across the bodywork,
     which is exactly what used to throw a black slash over the truck. */
  var LOAD_U    = [0.392, -0.92];   /* up out of the bed */
  var LOAD_SINK = 21;               /* sink this far and it is gone */
  function level(v){                    /* 1 = full to the brim, 0 = empty */
    var d = (1 - v) * LOAD_SINK;
    return { x: -LOAD_U[0] * d, y: -LOAD_U[1] * d };
  }

  /* ---------- STEP: the truck tips its bed and the tar pours out --------
     from/to are the bed's fill level either side of this drop. The truck
     arrives full, leaves the last patch empty, and only ever reloads
     off-stage - so nothing ever pops into an on-screen bed. */
  function dump(tl, c, at, from, to){
    var BED='#truck-'+c+'-bed', GATE='#truck-'+c+'-tailgate',
        LOAD='#truck-'+c+'-load', SPILL='#truck-'+c+'-spill';
    var A = level(from), Z = level(to);
    /* bed rises, then the tailgate drops open on its own hinge so the tar can
       leave; it swings shut again before the bed comes down */
    tl.to(BED,{rotation:0, duration:.90, ease:'power2.out'}, at+.15)
      .to(GATE,{rotation:0, duration:.45, ease:'power2.in'}, at+.55)
      /* Tar: the truck's own black spill artwork, wiped downward out of the
         tailgate so it reads as falling. Same #1a1a1a as the asphalt. */
      .fromTo(SPILL,{scaleY:0, opacity:1},
                    {scaleY:1, duration:.60, ease:'power1.in'}, at+.85)
      /* the heap drops over the same window the spill is falling, so the
         material looks like it MOVED rather than being copied */
      .fromTo(LOAD,{x:A.x, y:A.y},
                   {x:Z.x, y:Z.y, duration:1.20, ease:'power1.in'}, at+.95)
      .add(puff('#truck-'+c+'-dust'), at+1.15)
      .add(puff('#truck-'+c+'-dust'), at+1.75)
      .to(SPILL,{opacity:0, duration:.40, ease:'none'}, at+2.30)
      .to(GATE,{rotation:TAILGATE_SHUT, duration:.45, ease:'power2.out'}, at+2.35)
      .to(BED,{rotation:BED_REST, duration:.70, ease:'power2.inOut'}, at+2.50);
  }

  /* ---------- driving: x keyframes + matching wheel rotation ------------ */
  /* mirror: a machine drawn under scale(-1,1) renders rotation R as -R, so its
     wheels must be counter-rotated or they spin backwards as it drives. */
  function drive(tl, sel, keys, wheels, radius, slowLegs, mirror){
    tl.set(sel, {x:keys[0][1]}, 0);
    if(wheels.length) tl.set(wheels, {rotation:0}, 0);
    var rot = 0, dir = mirror ? -1 : 1;
    for(var i=0;i<keys.length-1;i++){
      var t0=keys[i][0], x0=keys[i][1], t1=keys[i+1][0], x1=keys[i+1][1];
      if(x1===x0) continue;                       /* a hold: machine is working */
      var ease = (slowLegs.indexOf(i)>=0) ? 'none' : 'power1.inOut';
      tl.to(sel, {x:x1, duration:t1-t0, ease:ease}, t0);
      rot += dir * (x1-x0) * 180 / (Math.PI * radius);
      if(wheels.length) tl.to(wheels, {rotation:rot, duration:t1-t0, ease:ease}, t0);
    }
  }

  /* =====================================================================
     ONE LAYOUT. Everything from here down depends on how wide the viewport
     is, so it all lives in build() and is thrown away and redone when the
     crop changes. Nothing above this line ever needs rebuilding.
     ===================================================================== */
  var LIVE = [];      /* timelines this layout owns */
  var VIEW = null;

  function teardown(){
    for(var i=0;i<LIVE.length;i++) LIVE[i].kill();
    LIVE = [];
    clearPatches();
  }

  function build(v){
    var C = clips(v.lead);

    /* Patches are drawn inside the WORKING ZONE - the centre of what is on
       screen - so the planner works in zone space and the result is shifted
       out to scene space. On a narrow screen the zone is narrower, so the
       patches sit closer together instead of running off the side; if it
       gets too tight for the asked-for count, capacity() drops one. */
    var cfg = {
      RANDOM_PATCHES: CONFIG.RANDOM_PATCHES, patchCount: CONFIG.patchCount,
      rollLead: v.lead, edgeMargin: CONFIG.edgeMargin, stopGap: CONFIG.stopGap,
      keepOut: CONFIG.keepOut, stageW: v.zoneW
    };
    var picked = CONFIG.RANDOM_PATCHES
      ? PLANNER.pick(cfg, Math.random)
      : { xs: PLANNER.spread(cfg, PLANNER.capacity(cfg)) };
    var XS = [], i;
    for(i=0;i<picked.xs.length;i++) XS.push(picked.xs[i] + v.zoneX);

    /* Wings measured off what is actually visible, keeping the shipped
       run-up distances - so machines are always off-screen when parked. */
    var park = {}, exit = {};
    for(i=0;i<PLANNER.ORDER.length;i++){
      var m = PLANNER.ORDER[i];
      park[m] = v.x + PLANNER.PARK[m];
      exit[m] = v.x + v.w + (PLANNER.EXIT[m] - 1920);
    }

    var KEYS = PLANNER.buildKeys(XS, v.lead, park, exit);
    var PATCHES = PLANNER.buildPatches(XS);
    var CYCLE = PLANNER.cycle(XS.length);
    var CREW_OFFSET = CYCLE / 2;
    var PATCH_PERIOD = CYCLE / 2;

    paintPatches(XS, C);
    patchOrigins(PATCHES, C);

    /* ---------- STATIC COMPOSED FRAME (also the reduced-motion frame) ---- */
    if(reduced){
      var lastP = PATCHES[PATCHES.length-1];
      gsap.set('#excavator-a',{x: lastP.x - PLANNER.DOCK.exc});
      gsap.set('#truck-a',{x: PATCHES[0].x - PLANNER.DOCK.truck});
      gsap.set('#roller-a',{x: PATCHES[0].x - 400});
      gsap.set(['#excavator-b','#truck-b','#roller-b'],{x: park.roll});
      gsap.set(['#truck-a-load','#truck-b-load'], level(1));
      PATCHES.forEach(function(p,i){
        gsap.set('#patch-'+p.id+'-roll',{scaleX:1});
        gsap.set('#patch-'+p.id+'-dig', {scaleY:1});
        gsap.set('#patch-'+p.id+'-fill',{scaleX: i === PATCHES.length-1 ? 0 : 1});
      });
      return;
    }

    /* the roller's pass over each patch is keyframe legs 2,4,6... - linear, so
       the clip wipe below can run on exactly the same clock */
    var ROLL_SLOW = [];
    for(var ri=0; ri<XS.length; ri++) ROLL_SLOW.push(2 + ri*2);

  /* =====================================================================
     ONE CREW PASS. Built twice; crew B runs the identical timeline half a
     cycle later, so the road is always worked and never empty.
     Every animated value is re-set at t=0 and every machine is off-stage at
     both t=0 and t=CYCLE, so the wrap is invisible - whatever positions the
     random draw picked.
     ===================================================================== */
  function crew(c){
    var tl = gsap.timeline({repeat:-1});
    var n = XS.length;

    /* 1. excavator leads: in from the left, digs each patch in turn, exits */
    drive(tl, '#excavator-'+c, KEYS.exc,
          ['#excavator-'+c+'-wheel-front','#excavator-'+c+'-wheel-rear'], R.exc, [], false);
    for(var i=0;i<n;i++) dig(tl, c, PLANNER.excAt(i));
    tl.set(['#excavator-'+c+'-wheel-front','#excavator-'+c+'-wheel-rear'],
           {rotation:0}, PLANNER.excAt(n-1) + T.dig + T.exitDur + 0.5);

    /* 2. dump truck follows, cab facing right, tailgate trailing over the hole */
    drive(tl, '#truck-'+c, KEYS.truck,
          ['#truck-'+c+'-wheel-front','#truck-'+c+'-wheel-mid','#truck-'+c+'-wheel-rear'],
          R.truck, [], true);
    /* THE LOAD'S LIFECYCLE. Set full at t=0 - which is off-stage, in the
       wings - so the truck is ALWAYS visibly loaded as it drives in. Each
       patch takes an equal share, and the last one empties it, so it leaves
       the final hole empty and drives off empty. The only refill is the t=0
       set on the next lap, and that happens off-screen. */
    tl.set('#truck-'+c+'-load', level(1), 0);
    tl.set('#truck-'+c+'-spill', {scaleY:0, opacity:0}, 0);
    for(i=0;i<n;i++)
      dump(tl, c, PLANNER.truckAt(i), (n - i) / n, (n - i - 1) / n);
    tl.set(['#truck-'+c+'-wheel-front','#truck-'+c+'-wheel-mid','#truck-'+c+'-wheel-rear'],
           {rotation:0}, PLANNER.truckAt(n-1) + T.dump + T.exitDur + 0.5);

    /* 3. roller last, drum leading. Its passes are linear and the clip wipe
          runs on the same clock, so the road goes smooth under the drum. */
    drive(tl, '#roller-'+c, KEYS.roll, ['#roller-'+c+'-wheel'], R.rollWheel, ROLL_SLOW, true);
    var rot = 0;
    for(i=0;i<KEYS.roll.length-1;i++){
      var t0=KEYS.roll[i][0], x0=KEYS.roll[i][1], t1=KEYS.roll[i+1][0], x1=KEYS.roll[i+1][1];
      if(x1===x0) continue;
      rot += -(x1-x0)*180/(Math.PI*R.rollDrum);   /* mirrored: counter-rotate */
      tl.to('#roller-'+c+'-drum', {rotation:rot, duration:t1-t0,
            ease:(ROLL_SLOW.indexOf(i)>=0)?'none':'power1.inOut'}, t0);
    }
    tl.set('#roller-'+c+'-drum',{rotation:0}, PLANNER.rollAt(n-1) + T.roll + T.exitDur + 0.5);
    for(i=0;i<n;i++){
      tl.add(puff('#roller-'+c+'-dust'), PLANNER.rollAt(i)+.3)
        .add(puff('#roller-'+c+'-dust'), PLANNER.rollAt(i)+1.0);
    }

    tl.to({}, {duration:CYCLE}, 0);   /* pin the timeline to a full cycle */
    return tl;
  }

  /* =====================================================================
     PATCH STATE. Each patch runs on its own half-cycle clock, because two
     crews service the same patches half a cycle apart.
       A untouched - nothing painted
       B hole      - grey chip, under the solid strip
       C overfill  - black tar mound proud of the road, burying the chip
       D smoothed  - drum takes chip and mound away together: nothing painted,
                     which is byte-for-byte the same as state A
     ===================================================================== */
  function patchTL(p){
    var DIG='#patch-'+p.id+'-dig', FILL='#patch-'+p.id+'-fill', ROLL='#patch-'+p.id+'-roll';
    var tl = gsap.timeline({repeat:-1});
    tl.set(DIG,{scaleY:0},0).set(FILL,{scaleX:0},0).set(ROLL,{scaleX:1},0);
    /* DIG IN LAYERS: each bite takes the hole one step deeper, so the
       stepped profile is uncovered a level at a time rather than all at
       once. Bite 1 a shallow uneven scrape, bite 3 the full chewed shape. */
    for(var i=0;i<3;i++)
      tl.to(DIG,{scaleY:BITE_SCALE[i], duration:.26*K, ease:'power2.out'}, (.30 + i*.90)*K);
    tl.to(FILL,{scaleX:1, duration:1.45, ease:'power1.out'}, p.fill[0]+.9);
    tl.to(ROLL,{scaleX:0, duration:p.wipe[1]-p.wipe[0], ease:'none'}, p.wipe[0]);
    tl.to({}, {duration:PATCH_PERIOD}, 0);
    return tl;
  }

    /* ---------- assemble ------------------------------------------------ */
    LIVE.push(crew('a').time(0));
    LIVE.push(crew('b').time(CREW_OFFSET));      /* half a cycle behind */
    PATCHES.forEach(function(p){
      LIVE.push(patchTL(p).time(((-p.start) % PATCH_PERIOD + PATCH_PERIOD) % PATCH_PERIOD));
    });
  }

  /* ---------- go, and follow the viewport ------------------------------- */
  /* The crop is already applied - the layout half did that before GSAP was
     even requested. This only has to populate it. */
  build(H.VIEW);

  /* A resize only forces a rebuild when the CROP changes: the patch positions
     are derived from the working zone, so they must be redrawn when it moves.
     Dragging a window inside one band costs nothing. */
  H.onLayout.push(function(v, changed){
    if(!changed) return;
    teardown(); build(v);
  });

  /* ---------- ambient: never frozen ------------------------------------- */
  gsap.to('#bg-near',{x:-24, duration:41, yoyo:true, repeat:-1, ease:'sine.inOut'});
  gsap.to('#bg-far', {x:-11, duration:57, yoyo:true, repeat:-1, ease:'sine.inOut'});
  for(var n2=1;n2<=18;n2++){
    gsap.fromTo('#cone-'+n2, {rotation:-0.55},
      {rotation:0.55, duration:2.3 + n2*0.31, yoyo:true, repeat:-1,
       ease:'sine.inOut', delay:n2*0.42});
  }
})();
</script>
</body>
</html>

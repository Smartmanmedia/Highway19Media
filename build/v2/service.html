<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ONE SHELL, ONE PAGE PER SERVICE. build_site.js fills the tokens from
     tools/services.js, drops in the site's header and footer, and pulls each
     question's answer from the Q&A page so the two never disagree. -->
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="https://highway19media.com/{{SLUG}}/">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta name="theme-color" content="#00287d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Highway 19 Media">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="https://highway19media.com/{{SLUG}}/">
<meta property="og:image" content="https://highway19media.com/assets/v2/meta/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="https://highway19media.com/assets/v2/meta/og.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/v2/meta/icon-32.png">
<link rel="apple-touch-icon" href="../../assets/v2/meta/icon-180.png">
<link rel="stylesheet" href="section-fonts.css">
<link rel="stylesheet" href="section-09.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="consent.css">
<link rel="stylesheet" href="service.css">
<script type="application/ld+json">{{LD}}</script>
</head>
<body class="svc-page{{PAGE}}" style="--lane:{{COLOR}}">
<!--HEADER-->
<main id="svc-main" tabindex="-1">

  <section class="svc-hero">
    <div class="svc-in svc-hero-in">
      <div class="svc-hero-say">
        <p class="svc-eyebrow">{{EYEBROW}}</p>
        <h1>{{H1}}</h1>
{{TAG}}        <div class="svc-lead">{{LEAD}}</div>
        <div class="svc-acts">
          <a class="svc-btn" href="/contact/">{{CTA}}</a>
          <a class="svc-btn svc-btn--ghost" href="#questions">Questions &amp; pricing</a>
        </div>
      </div>
{{HERO_ART}}
    </div>
  </section>

{{SECTIONS}}

  <section class="svc-cta">
    <div class="svc-in">
      <h2>{{CTA_H}}</h2>
{{CTA_P}}
      <a class="svc-btn" href="/contact/">{{CTA}}</a>
    </div>
  </section>

  <nav class="svc-next" aria-label="Other services">
    <div class="svc-in">
      <p class="svc-eyebrow">Other lanes</p>
      <ul>
{{NEXT}}
      </ul>
    </div>
  </nav>

</main>
<!--FOOTER-->
<script src="header.js" defer></script>
<script src="consent.js" defer></script>
</body>
</html>

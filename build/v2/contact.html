<style>
/* THE CONTACT PAGE IS THE CARD AND NOTHING ELSE - the same card the home
   page closes on and the holding page asks with, on the header's own sky
   so it reads as part of the site rather than a form on a blank sheet. */
body{ margin:0; background:#00287d }
/* the card asks its host for the type, as section eight gives it at home -
   without this it comes out in the browser's serif */
.ct{
  --font-sign:"Be Vietnam Pro","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color:#fff; font-family:var(--font-sign);
  font-size:clamp(16px,1.05vw,17.5px); line-height:1.62; font-weight:450;
  min-height:calc(100svh - var(--hh) - var(--hbar));
  display:grid; place-items:center;
  padding:clamp(28px,6vw,90px) clamp(16px,4vw,40px) clamp(48px,8vw,120px);
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%),
    linear-gradient(180deg,#0459bd 0%,#00287d 100%);
  scroll-margin-top:calc(var(--hh) + var(--hbar) + 8px);
}
.ct *,.ct *::before,.ct *::after{ box-sizing:border-box }
.ct img{ max-width:100%; display:block }
.ct a{ color:inherit }
.ct .fcard{ width:min(100%, 1240px); margin-top:0; --fc-btn:#ffc72c }
.ct-h{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0 }
:root[data-mode="night"] .ct{ background:linear-gradient(180deg,#06214e 0%,#010817 100%) }
</style>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highway 19 — the drive</title>
<style>
/* ============================================================================
   THE DRIVE — a first-person run down his Highway_PPV view, driven by scroll.

   ONE PROJECTION, WRITTEN OUT, AND NO 3D CONTEXT AT ALL. Everything in the
   scene - the tarmac, the lane markings, the trees, their shadows, his
   gantries - is placed by the same three lines: a thing at depth D is drawn at
   scale f/(f+D), its foot on the road at horizon + eye*scale. That is exactly
   what `perspective: f` does, done by hand.

   Doing it by hand rather than with CSS 3D buys three things. A 3D floor plane
   long enough for this road is 30,000px tall, which is past what a browser
   will rasterise - it silently paints nothing. Second, everything agrees with
   everything: a tree, its shadow and the dash beside it all come out of one
   number. Third, the earth curve is one more term in that number rather than a
   fight with a transform stack.

   WHAT MOVES AND WHAT DOES NOT. The road surface, its shoulders, the grass and
   the sea never move: four shapes, drawn once, re-cut only on resize. Only the
   lane markings and the things standing on the road are touched per frame, and
   each of those is a single transform - no reads, no measuring, no layout.
   ========================================================================= */
*{box-sizing:border-box}
html,body{margin:0;background:#0a1020;color:#fff;
  font-family:"Be Vietnam Pro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.runway{height:1100vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;isolation:isolate}

/* ---- his sky, his sun, his sea - four gradients, nothing that moves ------ */
.sky{position:absolute;inset:0;
  background:
    radial-gradient(760px 620px at 11% -4%, rgba(255,255,255,.98), rgba(255,255,255,0) 60%),
    linear-gradient(112deg,#fff 0%,#d4e7ff 15%,#a3ccff 36%,#7cb7ff 55%,#60a8ff 73%,#4f9fff 88%,#4a9cff 100%)}
/* HIS LIGHT, NOT FLAT PAINT. Every ground in his file is a RADIAL gradient
   whose centre sits under the sun - top left, the same place the sky's glow
   is - so the water, the verge and the tarmac are all brightest there and fall
   away to the far corner. Mine were three flat vertical ramps, which is why
   the render came back soft and cartoonish beside his: nothing in it agreed
   about where the light was coming from. One radial each, laid over the ramp
   that gives the near-to-far falloff, and the whole scene picks a side. */
.sea{position:absolute;left:0;right:0;
  background:
    radial-gradient(150% 260% at 6% -10%, rgba(120,205,255,.85), rgba(120,205,255,0) 62%),
    linear-gradient(180deg,#2064bd 0%,#12488f 44%,#08305f 100%)}
.land{position:absolute;left:0;
  background:
    radial-gradient(140% 220% at 6% -14%, rgba(190,255,120,.72), rgba(190,255,120,0) 58%),
    linear-gradient(180deg,#37850f 0%,#256409 46%,#164a05 100%)}
.road,.edge,.dash{position:absolute;left:0;top:0;will-change:transform}
.road{background:
    radial-gradient(150% 240% at 6% -12%, rgba(255,255,255,.34), rgba(255,255,255,0) 60%),
    linear-gradient(180deg,#4b4b4b 0%,#3b3b3b 42%,#2e2e2e 100%)}
/* HIS EDGES: a white line, then a yellow one just outside it, both sides. The
   centre dashes stay white. That is his gold on the shoulder line, so the road
   agrees with the signs without shouting down the middle of it. */
.edge{background:#fff}
.edge.gold{background:#ffda00}
.dash{background:#fff}

/* ---- what stands on it --------------------------------------------------
   Sprites, not vector. His four trees carry 247 shapes and 246 gradients -
   one per frond - and a palm in this scene is never still: it grows the whole
   way past the camera, and a gradient-filled group has to be re-rasterised at
   every new scale. Rasterised once at 1024 tall they are 1.7 to 3.4KB each and
   the compositor scales them for nothing. */
.thing{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 100%}
.thing img{display:block;height:100%;width:auto}
.sign img{filter:drop-shadow(0 14px 20px rgba(0,0,0,.22))}
.pole{background:linear-gradient(90deg,#8a9199,#f4f7fa 38%,#cdd4db 66%,#7d848c);
  border-radius:99px}
/* HIS GANTRY ARM, the same tile the page already uses over his hero sign,
   repeated along the arm so the cell keeps its shape whatever length the arm
   works out to at this distance. The tile is set from script off the hidden
   <img> above rather than written here: a url() inside an inline <style> is
   not something the build can turn into a data URI, and it silently 404s in
   the file it ships - which is exactly what it did. */
.truss{background-repeat:repeat-x;background-position:center;background-size:auto 100%}
/* HIS OWN SHADOWS, for the trees. He drew them - one under each palm, at 54%
   - properly projected onto the road, and nothing derived comes close: a
   front-view cut-out flipped onto the ground gives a smear, not a palm. The
   art already carries his opacity, so this class does nothing to it.

   THE ONE RISK with a drawn shadow is that it comes apart from what casts it,
   so it is never placed on its own: its size and its offset from the tree's
   FOOT are held as multiples of the tree's own height (palms.json, measured
   off his file), and the scene multiplies both by whatever height the tree is
   drawn at. The two are one object at every distance.

   The gantry is the exception - he drew no shadow for it - so the board, the
   arm and the pole still get the flipped-and-skewed kind, which is right
   enough for three flat rectangles. */
.shadow{transform-origin:50% 100%}
.shadow-derived{filter:brightness(0) blur(1.5px);opacity:.26}
.shadow img{display:block;height:100%;width:100%}

/* HIS CLOUDS, four of his own drawings instead of the four soft blobs that
   stood in for them. They are small enough to travel as SVG and they scale
   for nothing, so they can drift at whatever size the sky wants. */
.cloud{position:absolute;left:0;top:0;will-change:transform}
.cloud img{display:block;width:100%;height:auto}
/* HIS WAVE LINES. One strip each, laid flat on the water at its own depth and
   carried past by the same projection as the road, so they open out and slow
   down as they come. width:100% because a wave is stretched to the sea's
   width, not to its own drawn length. */
.wave{position:absolute;left:0;top:0;will-change:transform}
.wave img{display:block;width:100%;height:100%}

/* ---- read-outs ----------------------------------------------------------- */
.hud{position:fixed;left:16px;bottom:16px;z-index:9;font-size:12px;line-height:1.6;
  background:rgba(8,14,26,.74);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px);min-width:230px}
.hud b{font-weight:600}
.toggle{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;gap:8px}
.toggle button{font:inherit;font-size:12px;color:#fff;cursor:pointer;
  background:rgba(8,14,26,.74);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:7px 13px}
.toggle button[aria-pressed=true]{background:#1f6feb;border-color:#1f6feb}
.hint{position:fixed;left:50%;translate:-50% 0;bottom:64px;z-index:9;font-size:13px;
  background:rgba(8,14,26,.62);padding:8px 15px;border-radius:999px;transition:opacity .5s}
.hint.gone{opacity:0}
</style>

<div class="runway">
  <div class="stage" id="stage">
    <div class="sky"></div>
    <div class="sea" id="sea"></div>
    <div id="swell"></div>
    <div class="land" id="land"></div>
    <div class="road" id="road"></div>
    <div class="edge gold" id="goldL"></div>
    <div class="edge gold" id="goldR"></div>
    <div class="edge" id="edgeL"></div>
    <div class="edge" id="edgeR"></div>
    <div id="shadows"></div>
    <div id="marks"></div>
    <div id="props"></div>
  </div>
</div>

<!-- THE ART, ONCE. Every tree and both gantries are clones of these, so the
     page carries one copy of each however many are planted. -->
<div id="art" hidden>
  <img class="palm-a" src="../../assets/v2/section-05/palm-a.webp" alt="">
  <img class="palm-b" src="../../assets/v2/section-05/palm-b.webp" alt="">
  <img class="palm-c" src="../../assets/v2/section-05/palm-c.webp" alt="">
  <img class="palm-d" src="../../assets/v2/section-05/palm-d.webp" alt="">
  <img class="palm-a-sh" src="../../assets/v2/section-05/palm-a-shadow.webp" alt="">
  <img class="palm-b-sh" src="../../assets/v2/section-05/palm-b-shadow.webp" alt="">
  <img class="palm-c-sh" src="../../assets/v2/section-05/palm-c-shadow.webp" alt="">
  <img class="palm-d-sh" src="../../assets/v2/section-05/palm-d-shadow.webp" alt="">
  <img class="lamp-l" src="../../assets/v2/section-05/lamp-l.webp" alt="">
  <img class="lamp-r" src="../../assets/v2/section-05/lamp-r.webp" alt="">
  <img class="wave-1" src="../../assets/v2/section-05/wave-1.webp" alt="">
  <img class="wave-2" src="../../assets/v2/section-05/wave-2.webp" alt="">
  <img class="wave-3" src="../../assets/v2/section-05/wave-3.webp" alt="">
  <img class="wave-4" src="../../assets/v2/section-05/wave-4.webp" alt="">
  <img class="wave-5" src="../../assets/v2/section-05/wave-5.webp" alt="">
  <img class="cloud-1" src="../../assets/v2/section-05/cloud-1.svg" alt="">
  <img class="cloud-2" src="../../assets/v2/section-05/cloud-2.svg" alt="">
  <img class="cloud-3" src="../../assets/v2/section-05/cloud-3.svg" alt="">
  <img class="cloud-4" src="../../assets/v2/section-05/cloud-4.svg" alt="">
  <img class="hero" src="../../assets/v2/section-01/hero-sign.svg" alt="">
  <img class="sign3" src="../../assets/v2/section-05/sign-3.webp" alt="">
  <img class="trusstile" src="../../assets/v2/section-01/truss-cell.webp" alt="">
</div>

<div class="hud" id="hud"></div>
<div class="toggle">
  <button id="curveBtn" aria-pressed="false">earth curve</button>
  <button id="autoBtn" aria-pressed="false">auto-drive</button>
</div>
<div class="hint" id="hint">scroll to drive</div>

<script>
const stage=document.getElementById('stage'), props=document.getElementById('props'),
      shadows=document.getElementById('shadows'),
      swell=document.getElementById('swell'),
      marks=document.getElementById('marks'), hud=document.getElementById('hud'),
      road=document.getElementById('road'), sea=document.getElementById('sea'),
      goldL=document.getElementById('goldL'), goldR=document.getElementById('goldR'),
      land=document.getElementById('land'),
      edgeL=document.getElementById('edgeL'), edgeR=document.getElementById('edgeR');

/* ---- the world, in his units --------------------------------------------- */
/* HIS WORLD, IN HIS UNITS. Everything below is a distance in the same space:
   the camera floats EYE above the tarmac, the road is ROAD wide either side of
   the centre line, and a thing at depth D is drawn at f/(f+D) of its size.
   The road edge is a STRAIGHT LINE on screen - x = ROAD*(y-horizon)/EYE - so
   the tarmac, its shoulders and its two edge lines are three triangles from
   the vanishing point, cut once and never touched again. */
/* HIS NUMBERS, OFF HIS OWN FILE, and two of them are structural.

   HIS ROAD DOES NOT CONVERGE TO THE HORIZON. Its edges run from (1251,850)
   and (1500,850) down to (473,1180) and (2279,1180), and extended they meet
   at y 796.8 - fifty units ABOVE the top of his ocean. The road and the grass
   share that vanishing point and both are CUT OFF at the sea line, so the
   last of the road disappears behind the water rather than pinching to a
   point. That is what makes it a coast road.

   AND HIS GRASS IS A WEDGE, not a band. It runs to the same vanishing point
   at 3.576 across for every one down against the road's 2.355, so near the
   horizon you see almost all sea and the land only opens out as it comes at
   you. Mine was a full-width green field from the horizon down, which is what
   put the camera up in the air looking over it.

   ROAD/EYE = 2.368, LINE/EYE = 2.046 and GRASS/EYE = 3.597 are his three
   slopes; EYE is the only free number left and it just sets the units. */
/* EYE IS THE CAMERA'S HEIGHT ABOVE THE TARMAC and it is the only number here
   that is a choice rather than a measurement. His edge lines sit at 481, so a
   lane is 481 wide and one metre is about 131 of these units. 235 put the eye
   1.79 m up - a truck cab, looking down at the road. A saloon driver sits at
   about 1.16 m, which is 152. Nothing else moves: the road keeps its width,
   so from lower down its edges simply splay further across the bottom of the
   frame and the ground plane folds up towards the horizon, which is the whole
   difference between looking down at a road and looking along one. */
/* HIS THREE SLOPES, PUT BACK. The road's angle in the picture is ROAD/EYE and
   nothing else - not the focal length, which cannot change it: a point at
   (X, D) lands at x = f*X/D and y-hor = f*E/D, so x/(y-hor) = X/E whatever f
   is. You cannot zoom your way to more ocean. His file gives ROAD/EYE 2.368,
   LINE/EYE 2.046 and GRASS/EYE 3.597, and those held while EYE was 235.
   Dropping the eye to 152 for the saloon left the three widths where they were
   and so opened all three slopes by 235/152 - the road ran off both sides of
   the frame at the bottom and the verge swallowed the sea. Every width is
   multiplied by 152/235 here, which restores his angles at the new eye height
   and hands the corners back to the water. Everything that stands beside the
   road moves in by the same factor, so nothing changes which surface it is on;
   the trees and lamps keep their heights, which is what makes them tower the
   way they do in his picture. */
/* LINE is the white edge line, GOLD the yellow one just outside it, LANE the
   half-width they share, and the gap between them is one line's width. */
const EYE=152, ROAD=360, LINE=311, GOLD=325, GRASS=546, LANE=3.6, F0=0.62;
const VP=0.644, SEA=0.693;    /* his vanishing point, and his water line */
const RUN=19000;
const STOPS=[0.30,0.68], HOLD=0.06;
const DASH_LEN=61, DASH_GAP=97, DASH_W=19;
/* HOW FAR OUT A THING FADES UP. The water line is a hard clip - past it a
   thing would stand on the sea - so everything used to switch on at full
   strength the instant its foot cleared it, and a palm popped into existence.
   The fade is measured in DEPTH, not in screen pixels: a band of pixels above
   the horizon is a colossal distance out there, and the same band is a blink
   up close. FADE is the fraction of the visible run given over to coming up. */
const FADE=0.20;

/* ONE FRAME HEIGHT THE WORLD IS WRITTEN AT, and a scale to every other.
   The numbers above are lengths in a picture 810 tall, so on a taller stage
   every one of them has to be multiplied by U - and the focal length must NOT
   be, or the two grow at different rates and the framing changes with the
   window. That is what was happening: f was tied to H while EYE and ROAD were
   not, so the sea line cut the road off at 2800 on a laptop and 1160 on a 4K
   screen. Same scene, a third of the road. With f fixed in these units the
   depth at which the water cuts in is the same everywhere and the whole scene
   simply scales. */
const REF=810;
let W=0,H=0,U=1,f=REF*F0*2,hor=0,seaY=0,curve=0,near=-300,kSea=0,dSea=0,dFade=0;
function measure(){
  W=stage.clientWidth; H=stage.clientHeight;
  U=H/REF;                /* one world unit, in this stage's pixels */
  hor=Math.round(H*VP);
  seaY=Math.round(H*SEA);
  /* the scale at which a foot lands exactly on the water, and the depth that
     is - the far edge of the world, and the far end of the fade */
  kSea=(seaY-hor)/U/EYE;
  dSea=f/kSea-f;
  dFade=dSea*FADE;
  /* HOW CLOSE THE PAINT COMES. The markings wrap through a fixed pool, so the
     nearest one is wherever the wrap puts it - and that was a flat -300, which
     from a saloon lands the last dash three quarters of the way down the
     screen with bare tarmac below it. The road has to run off the BOTTOM EDGE,
     so the bound is worked out instead of picked. The scale that lands a dash
     on the foot of the frame is (H-hor)/EYE; back off one whole dash-and-gap
     beyond that and the NEAREST dash is below the bottom edge whatever phase
     the wrap happens to be in, which is the part a single margin missed - the
     pool holds one dash per period, so the last one on screen was free to sit
     anywhere in that period and sometimes stopped short. */
  near=f/((H-hor)/U/EYE)-f-(DASH_LEN+DASH_GAP)*1.15;
  const D=H-hor;                       /* screen distance from horizon to foot */
  const span=x=>x*D/EYE;               /* a world half-width, at the foot      */
  /* which is U*x*k at the depth whose foot is the bottom of the frame - the
     wedges and the props are the same projection written two ways */
  const pct=(x,y)=>(x/W*100).toFixed(3)+'% '+(y/H*100).toFixed(3)+'%';
  /* every wedge runs to his vanishing point and is cut off at his water line,
     so the far end of the road goes behind the sea instead of to a point */
  const at=(half,y)=>span(half)*(y-hor)/D;
  const wedge=(el,half)=>{
    el.style.width=W+'px'; el.style.height=H+'px';
    el.style.clipPath='polygon('+
      pct(W/2-at(half,seaY),seaY)+','+pct(W/2+at(half,seaY),seaY)+','+
      pct(W/2+span(half),H)+','+pct(W/2-span(half),H)+')';
  };
  const strip=(el,side,c,half)=>{
    el.style.width=W+'px'; el.style.height=H+'px';
    el.style.clipPath='polygon('+
      pct(W/2+side*at(c-half,seaY),seaY)+','+pct(W/2+side*at(c+half,seaY),seaY)+','+
      pct(W/2+side*span(c+half),H)+','+pct(W/2+side*span(c-half),H)+')';
  };
  sea.style.top=seaY+'px'; sea.style.height=(H-seaY)+'px';
  land.style.top='0'; land.style.height=H+'px'; land.style.bottom='auto';
  wedge(land,GRASS);
  wedge(road,ROAD);
  /* A SHADOW CAN ONLY FALL ON GROUND. Cut to the same wedge as the verge, so
     the ones on the seaward side stop at the water instead of lying on it -
     which is the last thing that gave the trees away as pasted on. The road
     is inside the verge, so this covers the tarmac too. */
  wedge(shadows,GRASS);
  strip(edgeL,-1,LINE,LANE); strip(edgeR,1,LINE,LANE);
  strip(goldL,-1,GOLD,LANE);  strip(goldR,1,GOLD,LANE);
}

/* ---- his two slow-downs --------------------------------------------------
   A smoothstep either side of each sign and a flat run in between: the road
   eases in, sits still while you read it, and eases out. The road given up to
   the holds is handed back to the cruise, so the trip still covers the same
   ground. */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function distance(t){
  let d=t;
  for(const s of STOPS){
    const a=s-HOLD,b=s+HOLD;
    if(t>a){
      const u=clamp((t-a)/(2*HOLD),0,1);
      d+=(smooth((u-.5)*2.4+.5)-u)*(2*HOLD);
    }
  }
  return d*RUN;
}

/* ---- what is on the road -------------------------------------------------- */
const art=document.getElementById('art');
const copy=c=>art.querySelector('.'+c).cloneNode(true);
const TRUSS_TILE=art.querySelector('.trusstile').src;
/* >>> palms (written by tools/make_palm_sprites.js - do not hand-edit) */
/* Per tree: fx is where the TRUNK stands across its own sprite, and the
   shadow's size and offset are multiples of the tree's height, measured
   from that trunk. */
const SH={
 "a": {
  "fx": 0.4207,
  "w": 0.655,
  "h": 0.1845,
  "dx": -0.0151,
  "dy": -0.0559
 },
 "b": {
  "fx": 0.6105,
  "w": 0.945,
  "h": 0.3495,
  "dx": -0.0223,
  "dy": -0.019
 },
 "c": {
  "fx": 0.346,
  "w": 0.9829,
  "h": 0.3635,
  "dx": -0.034,
  "dy": -0.0245
 },
 "d": {
  "fx": 0.6012,
  "w": 0.8428,
  "h": 0.2535,
  "dx": -0.0162,
  "dy": -0.0529
 }
};
/* <<< palms */
/* HIS SUN, read off his own drawing rather than chosen. Every one of his four
   shadows leaves the tree's foot heading down and to the RIGHT, so the light
   is at the top LEFT. Take the far corner of each shadow box as the shadow of
   the crown and average: the tip lands SUN_X of the tree's height across and
   SUN_Y of it down. Everything the scene has to invent a shadow for - the
   sign, the truss, the pole - is laid down that same ray. */
/* >>> props (written by tools/make_scene_props.js - do not hand-edit) */
/* Per sprite: ar is its aspect (w/h) and fx is where it STANDS across itself -
   a street lamp is planted by its mast, which is at the very edge of its box. */
const PROPS={
 "lamp-r": {
  "ar": 0.1921,
  "fx": 0.9373
 },
 "lamp-l": {
  "ar": 0.1921,
  "fx": 0.057
 },
 "wave-1": {
  "ar": 136.6994,
  "fx": 0.5
 },
 "wave-2": {
  "ar": 97.2504,
  "fx": 0.5
 },
 "wave-3": {
  "ar": 330.9379,
  "fx": 0.5
 },
 "wave-4": {
  "ar": 91.8739,
  "fx": 0.5
 },
 "wave-5": {
  "ar": 327.3299,
  "fx": 0.5
 }
};
/* <<< props */
const SUN=(function(){
  let sx=0,sy=0,n=0;
  for(const k in SH){ const g=SH[k]; sx+=g.dx+g.w; sy+=g.dy+g.h; n++; }
  return {x:sx/n, y:sy/n};
})();
const SUN_X=+SUN.x.toFixed(3), SUN_Y=+SUN.y.toFixed(3);
/* The skew that lays a flipped upright onto that ray. The skew shifts x by
   the point's height BEFORE the squash, so its tangent is SUN_X on its own -
   the squash to SUN_Y comes after and must not be counted twice. */
const SUN_A=+(Math.atan(SUN_X)*180/Math.PI).toFixed(1);
const items=[];
function plant(o){
  const el=document.createElement('div');
  el.className='thing '+(o.cls||'');
  if(o.art) el.appendChild(copy(o.art));
  if(o.cls==='truss') el.style.backgroundImage='url("'+TRUSS_TILE+'")';
  props.appendChild(el);
  /* A PALM IS PLANTED BY ITS TRUNK, not by the middle of its picture. His
     trees lean, so the box's centre sits out under the crown - as much as 15%
     of the sprite's width away on 'd' - and centring the sprite on the world
     x hung the trunk to one side of where it was standing. On the seaward row
     that error lands the trunk out over the water: floating. fx is where the
     trunk actually is across the sprite, read off the ink. */
  const it=Object.assign({el,lift:0,loop:false,
    fx:(o.art&&(SH[o.art.slice(-1)]||PROPS[o.art])||{}).fx||0.5},o);
  if(o.shadow){
    const sh=document.createElement('div');
    /* one of his four palms gets the shadow he DREW for it; everything else
       gets the flipped-and-skewed kind, which is all a flat rectangle needs */
    const drawn=o.art&&SH[o.art.slice(-1)];
    sh.className='thing shadow'+(drawn?'':' shadow-derived');
    if(drawn) sh.appendChild(copy(o.art+'-sh'));
    else if(o.art) sh.appendChild(copy(o.art));
    else sh.style.background='#000';
    if(o.cls==='truss'){sh.style.background='none';
      sh.style.backgroundImage='url("'+TRUSS_TILE+'")';
      sh.style.backgroundRepeat='repeat-x';sh.style.backgroundSize='auto 100%'}
    shadows.appendChild(sh);
    if(!drawn) sh.style.transformOrigin=(it.fx*100)+'% 100%';
    it.sh=sh; it.shGeo=drawn||null;
  }
  items.push(it); return it;
}
/* HIS AVENUE. Four trees cycling, alternating sides, the far row offset by
   half a gap so the two never line up - which is what stops it reading as
   wallpaper. */
/* THE AVENUE HAS ITS OWN SPACING NOW, and it has to. From a saloon the sea
   line cuts the road off at about 2800 rather than 4900, so at the gantries'
   1150 the far half of the avenue fell behind the water and the horizon went
   bare. Closing the trees to 820 puts the same number back in frame; they
   still pass at the speed the road sets, since that is depth, not spacing. */
const PALM_GAP=820, LOOP=PALM_GAP*10;   /* ten trees a side, so ten gaps */
const PALMS=['palm-a','palm-b','palm-c','palm-d'];
for(let i=0;i<20;i++){
  const side=i%2?1:-1, n=Math.floor(i/2);
  /* EACH ROW GETS ALL FOUR TREES. Picking the sprite with i%4 while the side
     came off i%2 meant the two cycles were locked: 'a' and 'c' fell on every
     even i and 'b' and 'd' on every odd one, so the shore row was always his
     two deeply shaded palms and the seaward row always his two flat ones. One
     side looked modelled and the other looked washed out, and it was never the
     light - it was the same two drawings over and over. Walking the sprite
     with n instead, offset two between the rows, gives each side all four and
     still keeps the rows from lining up. The height rides the sprite so a tree
     is the same size wherever it stands. */
  const a=(n+(i%2)*2)%4;
  /* ON THE GREEN, WHICH IS NARROWER THAN IT LOOKS. The verge only reaches
     GRASS across; anything planted beyond that has its foot on the water,
     which is exactly where mine were. His own nearest palm stands at 721 of
     a possible 845 - just past the tarmac's 557 and well inside the grass -
     so that is the band they get. */
  plant({cls:'palm',art:PALMS[a],shadow:true,
    x:side*(444+(i%2)*25),
    z:-420-n*PALM_GAP-(side>0?PALM_GAP/2:0),
    h:590+a*70, loop:true});
}
/* HIS TWO GANTRIES, AND WHERE THE ROAD STOPS FOR THEM. The slow-down is
   centred on the sign's own place in the trip, so a sign standing exactly
   there is level with the camera when the road stops - which is why the first
   pass read as "close but far": you halted beside it rather than in front of
   it. Each board is set AHEAD of its stop by a reading distance, so the road
   comes to rest with the sign filling the frame in front of you. */
/* HIS GANTRY, WORKED OUT OF HIS OWN PICTURE rather than guessed. At the
   depth where his pole meets the ground the road is 596 across on screen and
   his board is 469 - so the board is 0.787 of the road's half-width, which is
   438 in these units, a board 876 wide and therefore 326 tall. His pole sits
   at 1.149 of that half-width, which is 640: inside the verge, not out over
   the water. Mine was 900 tall - nearly three times his - and the pole had to
   be shoved to 1450 to clear it, which is what put it in the sea.

   The board's bottom rides 508 above the pole's foot, and the arm runs from
   the board's right edge at 417 out to the pole. */
const AHEAD=420;
/* TWO BOARDS, NOT THE SAME ONE TWICE. Both hang 875 wide off the gantry - that
   is the width his picture sets - so the height follows from each board's own
   aspect rather than being chosen: his hero is 2.685 to one and his third
   board is 3.183, which is 326 tall and 275 tall at that width. */
const BOARD_W=566, BOARDS=[{art:'hero',ar:938.50/349.56},{art:'sign3',ar:940.5/295.5}];
STOPS.forEach((s,si)=>{
  const z=-(s*RUN)-AHEAD, b=BOARDS[si%BOARDS.length];
  /* the board hangs higher than his old file put it, because in his new views
     it clears the palms instead of sitting among them - width is his, height
     off the ground is his picture's */
  plant({cls:'sign',art:b.art,x:-14,z,h:Math.round(BOARD_W/b.ar),lift:436,shadow:true});
  plant({cls:'truss',x:342,z,h:62,w:149,lift:496,shadow:true});
  plant({cls:'pole',x:414,z,h:606,w:22,shadow:true});
});
/* HIS STREET LAMPS. He drew each one eight times over, once per distance, but
   the scene only needs the shape twice - mast right with the arm reaching left
   for the seaward verge, and its mirror - because the projection does the rest.
   The mast stands at 600: outside the tarmac's 557 and inside the palms' 686,
   which is where he put them, between the road and the trees. The arm reaches
   0.94 of the lamp's own width inward, so at this height its tip lands just
   over his edge line. They are on the same wrap as the trees, at twice the
   spacing and offset half a gap, so a lamp falls between two palms. */
const LAMP_H=620;
for(let i=0;i<20;i++){
  const side=i%2?1:-1, n=Math.floor(i/2);
  plant({cls:'lamp',art:side>0?'lamp-r':'lamp-l',shadow:true,
    x:side*414, h:LAMP_H,
    z:-420-n*PALM_GAP-(side>0?PALM_GAP/2:0)+PALM_GAP/2, loop:true});
}
/* HIS WAVE LINES, five of them, laid on the water and wrapped like the paint.
   The sea is the same plane as the road here, so a line at depth D lands on
   the row a tree at D would stand on and the projection spaces them for free:
   crowded at the horizon, opening out as they come. They are stretched to
   SEA_W across, well past the frame, and the verge is drawn over the top of
   them so they only ever show in the water either side of the land. */
const SEA_W=4200, WAVE_GAP=190, WAVES=[];
for(let i=0;i<15;i++){
  const el=document.createElement('div');
  el.className='wave';
  const art='wave-'+(1+i%5);
  el.appendChild(copy(art));
  swell.appendChild(el);
  WAVES.push({el,z:-i*WAVE_GAP,ar:PROPS[art].ar});
}
/* clouds, drifting on their own clock - his sky is never still */
const clouds=[];
for(let i=0;i<8;i++){
  const c=document.createElement('div');
  c.className='cloud';
  c.appendChild(copy('cloud-'+(1+i%4)));
  stage.insertBefore(c,sea);
  /* his sky, off his own picture: small, scattered from the top of the frame
     down to just above the water, and the nearer ones drifting faster */
  clouds.push({el:c,x:Math.random(),y:.05+(i%4)*.11+(i>3?.055:0),
    s:.0035+(i%4)*.0014,w:135+(i%4)*52});
}

/* ---- the lane markings ---------------------------------------------------
   A pool of quads, each one a length of paint at its own depth. They wrap, so
   twenty-two of them are a road of any length, and because each is placed by
   the same projection as everything else they stretch and slow with distance
   on their own - which is the whole of what makes it read as speed. */
const DASHES=[];
for(let i=0;i<26;i++){
  const d=document.createElement('div');
  d.className='dash';
  marks.appendChild(d);
  DASHES.push({el:d,z:-i*(DASH_LEN+DASH_GAP)});
}

/* ---- the frame ------------------------------------------------------------ */
function place(drive){
  const wrapD=(D,span,n)=>{n=n===undefined?-300:n;
    while(D<n)D+=span;while(D>span+n)D-=span;return D};
  /* the road markings */
  const span=DASHES.length*(DASH_LEN+DASH_GAP);
  for(const d of DASHES){
    let D=wrapD(-(d.z+drive),span,near);
    const kN=f/(f+D), kF=f/(f+D+DASH_LEN);
    if(D<-f+60||kN>10){d.el.style.opacity=0;continue}
    const yN=hor+U*(EYE*kN+curve*D*D*2.2e-6*kN);
    const yF=hor+U*(EYE*kF+curve*(D+DASH_LEN)*(D+DASH_LEN)*2.2e-6*kF);
    const w=Math.max(.6,U*DASH_W*kN), wF=Math.max(.4,U*DASH_W*kF);
    const up=smooth((dSea-D)/dFade);
    if(up<=0.004){d.el.style.opacity=0;continue}
    d.el.style.opacity=up;
    d.el.style.width=w+'px';
    d.el.style.height=Math.max(.5,yN-yF)+'px';
    /* A LENGTH OF PAINT IS A TRAPEZIUM, not a rectangle. Its far end is that
       much further away than its near end, so it is narrower by the ratio of
       the two scales - and at the bottom of the screen, where a dash is 200px
       long, that ratio is better than two to one. Drawn square they read as
       floating tiles. One clip-path off numbers already worked out. */
    const r=wF/w;
    d.el.style.clipPath='polygon('+(50-r*50)+'% 0,'+(50+r*50)+'% 0,100% 100%,0 100%)';
    d.el.style.transform='translate('+(W/2-w/2)+'px,'+yF+'px)';
  }
  /* HIS WATER. Same wrap, same projection, one transform each. A line is
     stretched to the sea's width and keeps its own thickness off its aspect,
     so a near ripple is fat and a far one is a hair. */
  for(const wv of WAVES){
    let D=wrapD(-(wv.z+drive),WAVE_GAP*WAVES.length,near);
    const k=f/(f+D);
    if(D<-f+60||k>6){wv.el.style.opacity=0;continue}
    const y=hor+U*(EYE*k+curve*D*D*2.2e-6*k);
    if(y<seaY){wv.el.style.opacity=0;continue}
    /* THE OCEAN HAS NO EDGES. A line of swell runs to the ends of the water,
       so it is drawn the full width of the frame at every depth - only its
       THICKNESS is perspective, off the width the sea would have had. Scaling
       the width as well made each line a short dash floating in the middle of
       the sea, which is what it looked like. */
    wv.el.style.opacity=1;
    wv.el.style.width=W+'px';
    wv.el.style.height=Math.max(.6,U*SEA_W*k/wv.ar)+'px';
    wv.el.style.transform='translate(0px,'+y+'px)';
  }
  /* the things standing on it */
  for(const it of items){
    let D=-(it.z+drive);
    if(it.loop) D=wrapD(D,LOOP);
    if(D<-f+80){it.el.style.opacity=0;if(it.sh)it.sh.style.opacity=0;continue}
    const k=f/(f+D);
    /* THE EARTH CURVE. Everything sinks with the square of its distance and
       the road sinks with it, so the far end falls away like the far side of
       a very big hill. One more term in a number already being written. */
    const dip=curve*D*D*2.2e-6*k;
    const baseY=hor+U*(EYE*k+dip), x=W/2+U*it.x*k, h=U*it.h*k;
    /* HIS WATER LINE IS THE FAR CLIP - a thing whose foot lands above it is
       further away than the sea and would float on top of it - but it does not
       have to be a switch. Over the last dFade of the run a thing comes up
       from nothing, so it arrives out of the haze at the horizon instead of
       appearing. Smoothed at both ends, or the ramp itself shows as a corner. */
    const up=smooth((dSea-D)/dFade);
    if(up<=0.004){it.el.style.opacity=0;if(it.sh)it.sh.style.opacity=0;continue}
    it.el.style.opacity=up;
    it.el.style.zIndex=Math.round(9000-D/4);
    it.el.style.height=h+'px';
    if(it.w) it.el.style.width=(U*it.w*k)+'px';
    it.el.style.transform='translate('+x+'px,'+(baseY-h-U*it.lift*k)+'px)'+
      ' translateX(-'+(it.fx*100)+'%)';
    if(it.sh){
      it.sh.style.zIndex=2;
      if(it.shGeo){
        /* HIS OWN SHADOW, hung off the tree's foot. Both its size and its
           offset are multiples of the tree's height, so it grows and travels
           with the tree and cannot drift from it. Nothing is flipped, skewed
           or filtered: his drawing already carries the projection and the
           54% he set. */
        const g=it.shGeo;
        /* his groups carry 54% and the rasteriser flattened it into the pixels
           rather than the alpha, so it goes back on here */
        it.sh.style.opacity=.54*up;
        it.sh.style.width=(h*g.w)+'px';
        it.sh.style.height=(h*g.h)+'px';
        it.sh.style.transform='translate('+(x+h*g.dx)+'px,'+(baseY+h*g.dy)+'px)';
      } else {
        /* the gantry, which he drew no shadow for. His sun is at the top
           LEFT: measure his own four shadows and every one of them runs
           down and to the RIGHT, the tip landing SUN_X of the tree's height
           across and SUN_Y of it down. So the derived shadow uses his
           numbers, not a guess - flip it about its own foot (scaleY -SUN_Y),
           lay it over with a skew whose tangent is SUN_X/SUN_Y, and the top
           of the object lands exactly where his palms put theirs.
           Anything hanging in the air rides the same ray: its shadow is
           carried out by its lift, across AND down. */
        const lx=U*(it.lift||0)*SUN_X*k, ly=U*(it.lift||0)*SUN_Y*k;
        it.sh.style.opacity=(it.lift?.18:.26)*up;
        it.sh.style.height=h+'px';
        if(it.w) it.sh.style.width=(U*it.w*k)+'px';
        /* A LAMP IS NOT SYMMETRICAL. It stands on its mast, which is at 94% of
           the way across its own sprite, so the flip and the skew have to turn
           about THAT point - pivoting the shadow at the middle of the box put
           it most of an arm's length away from the mast it belongs to. Same
           fx the lamp itself is planted by; a sign or a pole is 0.5 and
           nothing changes for them. */
        it.sh.style.transform='translate('+(x+lx)+'px,'+(baseY+ly)+'px)'+
          ' translate(-'+(it.fx*100)+'%,-100%) scaleY(-'+SUN_Y+') skewX('+(-SUN_A)+'deg)';
      }
    }
  }
}

/* ---- scroll --------------------------------------------------------------- */
let costSum=0,costN=0;
let auto=false,autoT=0,last=performance.now(),frames=0,fpsT=last,worst=999;
function tick(now){
  const dt=now-last; last=now;
  let t;
  if(auto){autoT=(autoT+dt/34000)%1;t=autoT}
  else{const max=document.documentElement.scrollHeight-innerHeight;t=max>0?scrollY/max:0}
  const t0=performance.now(); place(distance(t)); const cost=performance.now()-t0;
  costSum+=cost; costN++;
  for(const c of clouds){
    c.x=(c.x+c.s*dt/1000)%1.3;
    /* his sky scales with the frame too, or the clouds shrink to specks on a
       big screen while the road stays the size it was */
    c.el.style.width=(U*c.w)+'px';
    c.el.style.transform='translate('+((c.x*1.3-.15)*W)+'px,'+(c.y*H)+'px)';
  }
  frames++;
  if(now-fpsT>500){
    const fps=Math.round(frames*1000/(now-fpsT));
    if(fps<worst&&now>3000) worst=fps;
    frames=0;fpsT=now;
    const near=STOPS.findIndex(s=>t>s-HOLD&&t<s+HOLD);
    const ms=(costSum/Math.max(1,costN)).toFixed(2); costSum=0; costN=0;
    hud.innerHTML='<b>'+fps+' fps</b>'+(worst<999?' &nbsp;·&nbsp; worst '+worst:'')+
      ' &nbsp;·&nbsp; '+ms+'ms a frame'+
      '<br>'+(items.length+DASHES.length+WAVES.length+clouds.length)+' moving parts &nbsp;·&nbsp; '+
      '4 static shapes<br>trip '+Math.round(t*100)+'% &nbsp;·&nbsp; '+
      (near>=0?'slowing for sign '+(near+1):'cruising');
  }
  requestAnimationFrame(tick);
}
addEventListener('resize',measure);
measure(); requestAnimationFrame(tick);
addEventListener('scroll',()=>document.getElementById('hint').classList.add('gone'),{once:true});
document.getElementById('curveBtn').onclick=e=>{curve=curve?0:1;
  e.currentTarget.setAttribute('aria-pressed',String(!!curve))};
document.getElementById('autoBtn').onclick=e=>{auto=!auto;
  e.currentTarget.setAttribute('aria-pressed',String(auto))};
</script>

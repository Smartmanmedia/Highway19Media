<div id="intro"><svg id="intro-svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="tqInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121725"/><stop offset=".55" stop-color="#0B0E14"/><stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="tqGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tqGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#tqInk)"/>

  <!-- THE MARK, DRAWN. Each leaf carries pathLength="1", so the dash runs in
       its own units and no two leaves need the same real length to finish
       together. Three strands, in the order the firm argues them. -->
  <g id="tq-mark" transform="translate(195 372) scale(1.15) translate(-100 -100)"
     fill="none" stroke="#C8A96A" stroke-width="5.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#tqGlow)">
    <circle id="tq-ring" cx="100" cy="100" r="64" stroke-width="2.4" opacity=".55" pathLength="1"/>
    <g transform="translate(0 -10.2)">
      <path id="tq-k1" pathLength="1" d="M100.000,73.442 A46.0,46.0 0 0 1 100.000,153.116 A46.0,46.0 0 0 1 100.000,73.442Z"/>
      <path id="tq-k2" pathLength="1" d="M123.000,113.279 A46.0,46.0 0 0 1 54.000,73.442 A46.0,46.0 0 0 1 123.000,113.279Z"/>
      <path id="tq-k3" pathLength="1" d="M77.000,113.279 A46.0,46.0 0 0 1 146.000,73.442 A46.0,46.0 0 0 1 77.000,113.279Z"/>
    </g>
    <g id="tq-shine" clip-path="none" opacity="0">
      <rect x="-60" y="0" width="46" height="200" fill="url(#tqGlint)" transform="skewX(-16)" style="mix-blend-mode:screen"/>
    </g>
  </g>

  <g id="tq-word" opacity="0">
    <text x="195" y="556" text-anchor="middle" class="tq-n">TRIQUETRA</text>
    <text x="195" y="586" text-anchor="middle" class="tq-s">LAW GROUP</text>
    <line x1="155" y1="606" x2="235" y2="606" stroke="#C8A96A" stroke-width="1" opacity=".5"/>
    <text x="195" y="632" text-anchor="middle" class="tq-t">INTELLECTUAL PROPERTY &#183; BOSTON</text>
  </g>
</svg><div id="intro-acts"><button type="button" id="intro-install">Add to Home Screen</button></div></div>

<!-- HIS PRINT & BRANDING ICON, drawn from his own Mobile_Cards render, used at both sizes. His
     file points at ../../print.png, which is an EXTERNAL reference and never
     travels with the SVG - so this is his drawing traced rather than his file.
     White line on nothing, so the tab's colour shows through. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"
     stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- the sheet feeding in over the top -->
  <path d="M27 20h34v20H27z"/>
  <path d="M35 27h18M35 34h12"/>
  <!-- the printer itself -->
  <path d="M12 40h62a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V46a6 6 0 0 1 6-6z"/>
  <circle cx="67" cy="52" r="3.5" fill="#fff" stroke="none"/>
  <!-- and the page coming out of the front of it -->
  <path d="M23 64h39v42H23z"/>
  <path d="M31 78h23M31 88h23M31 98h15"/>
  <!-- his printed piece, standing beside it with a turned corner -->
  <path d="M92 24h19l13 13v67H92z"/>
  <path d="M111 24v13h13"/>
  <path d="M100 58h16M100 70h16M100 82h10"/>
</svg>

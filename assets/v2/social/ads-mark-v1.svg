<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 673" width="749" height="673">
  <!-- An abstract take on the Google Ads mark, drawn for Highway 19 Media: its
       yellow and blue strokes and green dot pulled apart, shortened and softened,
       so the three pieces still read as the A without being Google's artwork. -->
  <defs><linearGradient id="y" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f6a609"/><stop offset="1" stop-color="#fdd247"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa3ff"/><stop offset="1" stop-color="#2f6fe0"/></linearGradient><radialGradient id="g" cx=".38" cy=".34" r=".7"><stop offset="0" stop-color="#62d482"/><stop offset="1" stop-color="#239449"/></radialGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1f3f" flood-opacity=".22"/></filter></defs>
  <g filter="url(#s)"><g transform="translate(212 392) rotate(30)"><rect x="-59" y="-190" width="118" height="380" rx="59" fill="url(#y)"/><path d="M-25.96 -136.9 L-25.96 -13" stroke="#fff" stroke-width="10.62" stroke-linecap="round" opacity=".5" fill="none"/></g><g transform="translate(505 318) rotate(-30)"><rect x="-69" y="-250" width="138" height="500" rx="69" fill="url(#b)"/><path d="M-30.36 -187.9 L-30.36 -43" stroke="#fff" stroke-width="12.42" stroke-linecap="round" opacity=".5" fill="none"/></g><circle cx="96" cy="590" r="74" fill="url(#g)"/><path d="M62 572 A40 40 0 0 1 96 548" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".5"/></g>
</svg>
